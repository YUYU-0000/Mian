    <style>
      html,body,#root{margin:0;width:100%;height:100%;background:#f1efe9;color-scheme:light}
      .auth-page{position:fixed;inset:0;z-index:100;overflow:auto;background:#f1efe9 url('/grain.png');color:#3b4d5a;font-family:"LXGW Heart Serif",serif}
      .auth-gate{--auth-edge-gap:calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .03);position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto}
      .auth-brand{position:absolute;top:calc(var(--auth-edge-gap) + env(safe-area-inset-top,0px));left:30px;font:400 34px/1 ZSFT-br,serif;letter-spacing:1px;color:#2d3c47}
      .auth-decor{position:absolute;top:calc(var(--auth-edge-gap) + env(safe-area-inset-top,0px));right:28px;display:flex;gap:8px;align-items:flex-start}
      .auth-en{writing-mode:vertical-rl;font:500 8px/1 ZSFT-br,serif;letter-spacing:2.5px;text-transform:uppercase;opacity:.75;padding-top:1px}
      .auth-decor-line{width:1px;height:65px;background:linear-gradient(180deg,rgba(90,112,130,.6),rgba(90,112,130,0))}
      .auth-cn{margin:0;writing-mode:vertical-rl;font:800 24px/1 "LXGW Heart Serif",serif;letter-spacing:12px;background:linear-gradient(180deg,#5a7082,rgba(90,112,130,.15));-webkit-background-clip:text;background-clip:text;color:transparent}
      .auth-brand,.auth-decor,.auth-keyrow,.auth-foot{visibility:hidden}
      .gate-fonts-ready :is(.auth-brand,.auth-decor,.auth-keyrow,.auth-foot){visibility:visible}
      .auth-skeleton-fish{position:absolute;left:50%;top:50%;width:250px;height:398px;transform:translate(-50%,-50%);opacity:.2;background:linear-gradient(90deg,#7f9bb8 32%,#c58f92 68%);-webkit-mask:url('/fish_hi.png') center/contain no-repeat;mask:url('/fish_hi.png') center/contain no-repeat}
    </style>
    <title>Mian</title>
  </head>
  <body>
    <div id="root">
      <main class="auth-page">
        <div class="auth-gate">
          <div class="auth-brand">Mian</div>
          <header class="auth-decor"><span class="auth-en">Private Archive</span><span class="auth-decor-line"></span><h1 class="auth-cn">敲門</h1></header>
          <div class="auth-skeleton-fish" aria-hidden="true"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
