<!DOCTYPE html>
<!--
  提示詞應用「線索」設計稿 v2（牆 + 圖釘 + 信封 + 卡片頁）
  全屏：跟其他頁一樣鋪滿手機屏幕（100vw × 100dvh），底部留出 safe-area。所有東西都保持在屏幕以內：
  - 卡片、肖像、釘子拖動或改大小時，橫向夾在屏幕寬度內，縱向不跑到標題上面。
  - 信封收起時按屏幕寬度縮放（最大 0.8 倍，給圖釘盒留位置）；打開時按屏幕寬高縮放（最大 1 倍），保證整張抽出的紙片和上面的文字都在屏幕裡。
  牆
  - 位置由用戶自己拖，拖到哪存到哪；按下時提到最上層。可以拖到屏幕最上面（頂部不留禁區、標題區沒有底色，返回鍵和標題浮在卡片上面）。霧只在三個地方：信封和郵票周圍一圈（照外形鋪牆色再整塊模糊 22px，四邊均勻往外淡）、左上（返回鍵）、右上（標題）。其他位置的卡片不受影響。
  - 單擊卡片：彈出卡片頁（見下）。長按卡片 0.5 秒：進入調整，外圈一道細實線，右下角出現拐角把手，拖它自由調寬高（最小 56×56）。點牆的空白處完成。
  - 默認卡片小一點、偏方正：84×88（寬高比 160:168）。紙片內部按寬 160 的設計單位排，高度隨比例變，豎向位置用百分比，整體按寬度縮放。
  - 牆上默認不連線。線只是裝飾，和卡片是否生效無關。
  圖釘
  - 左下角圖釘盒，按住一顆拖到牆上放開就釘住：落在卡片上跟著卡片走（存相對卡片寬高的比例位置，含旋轉；卡片改大小時按比例走），落在空白處就釘在牆上。
  - 點一顆（選中，外圈一圈線色的環），再點另一顆，拉一根紅棉線（實線，兩股，微微下垂）。再點同一顆取消。已經連過的不重複連。
  - 長按 1 秒拔掉，連著它的線一起消失；按住時外圈有一圈進度。拖動釘子線跟著走，放開時重新判斷落在哪張卡片上。
  信封
  - 橫放 270×140 的比例不變。點開：遮罩，信封移到底部正中，上封口翻開。裡面一疊紙片平時半抽；左右滑換一張；上滑或點一下整張抽出；下滑放回；整張抽出時再點一下貼到牆上。點遮罩空白處收起。
  卡片頁（單擊牆上的卡片）
  - 一張檔案館比例（3.2:4.2）的紙在屏幕中央，微轉 -0.4deg。常駐和觸發用同一種紙，觸發卡在牆上底部一行斜體小字（前面一個空心小菱形）寫「什麼時候想起」，不用色條。
  - 復古檔案卡：雙線內框、編號、花體小字、居中標題、菱形裝飾線、日期。頂上常駐／觸發（方框勾選）。觸發卡多出「什麼時候想起」（一句自然語言描述，由模型自己判斷，不是關鍵詞匹配）和場景（生成語音條）。
  - 內容：橫線紙上的多行輸入。底部：撕掉（點兩次才撕，連釘子和線一起去掉）、字數、收起。收起時保存。
  - 不用省略號、不用左側粗條、不用間隔點。
  - 形狀只用方形和菱形，不用圓形（釘子頭除外）；不用牛皮黃。
  - 頂部：和檔案館一樣。左邊是小魚返回鍵，右邊是豎排 CLUE WALL、漸隱豎線、漸變的「線索」（直接沿用 SettingsLayout 的 .back-btn 和 .right-decor）。不顯示卡片數。
-->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>
@import url("../client/public/fonts/lxgw/result.css");
@font-face{font-family:"ZSFT-l";src:url("../client/public/fonts/zsft-l/Qwigley-Regular.ttf") format("truetype")}
@font-face{font-family:ZSFT-br;src:url("../client/public/fonts/zsft/main.woff2") format("woff2");font-weight:400}
@font-face{font-family:ZSFT-br;src:url("../client/public/fonts/zsft/medium.woff2") format("woff2");font-weight:500}
:root{--ink:#3b4d5a;--muted:#72828e;--wall:#f1efe9;--paper:#fbfaf6;--warm:#f4eee3;
--blue:#6b8396;--blue2:#8fa6b5;--blue3:#c9d5dd;--oat:#c7ae8c;--oat2:#e4d6bf;--thread:#a7745a;
--env:#4f6475;--flap:#566d7f;--low:#5a7183;--inside:#3f5261;--gold:#c9b08a;
--serif:"LXGW Heart Serif","Noto Serif CJK TC",serif;--en:"ZSFT-br","Noto Serif CJK TC",serif;
--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--kc:.8;--k:1;
--grain:url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.07"/></svg>')}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wall)}
body{font-family:var(--serif);color:var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.app{position:fixed;inset:0;width:100vw;height:100dvh;background:var(--wall);background-image:var(--grain);overflow:hidden;user-select:none;-webkit-user-select:none}

/* 頂部 */
.head{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 24px) 16px 18px;display:flex;justify-content:space-between;align-items:flex-start;z-index:6;pointer-events:none;--icon-bg-4:#5a7082;--icon-bg-4-rgb:90,112,130}
/* 返回鍵和右側標題沿用檔案館（SettingsLayout 的 .back-btn / .right-decor） */
.head .back-btn{display:inline-flex;align-items:flex-start;cursor:pointer;position:relative;pointer-events:auto;margin-top:-2px;transition:transform .2s ease,opacity .2s ease}
.head .back-btn::after{content:"";position:absolute;top:-10px;right:-15px;bottom:-10px;left:-15px}
.head .back-btn:active{opacity:.6;transform:translateX(-4px)}
.head .right-decor{display:flex;flex-direction:row;align-items:flex-start;gap:8px}
.head .archive-en{writing-mode:vertical-rl;font-size:8px;letter-spacing:2.5px;color:var(--muted);font-weight:500;opacity:.75;text-transform:uppercase;line-height:1;padding-top:1px;font-family:var(--en)}
.head .decor-line{width:1px;height:65px;background:linear-gradient(180deg,rgba(var(--icon-bg-4-rgb),.6) 0%,rgba(var(--icon-bg-4-rgb),0) 100%)}
.head .archive-cn{writing-mode:vertical-rl;font-size:24px;font-weight:800;letter-spacing:12px;line-height:1;color:transparent;
  background:linear-gradient(180deg,var(--icon-bg-4) 0%,rgba(var(--icon-bg-4-rgb),.15) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* 牆 */
.wall{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.wall::-webkit-scrollbar{display:none}
.board{position:relative;width:100%}
.item{position:absolute;touch-action:none;cursor:grab}
.item.land{animation:land .28s cubic-bezier(.22,.8,.3,1)}
@keyframes land{from{opacity:0;transform:translateY(-14px) rotate(var(--r)) scale(1.1)}}
.card{box-shadow:0 1px 1px rgba(0,0,0,.05),0 5px 12px rgba(30,40,50,.13)}
.item.edit{box-shadow:0 0 0 2px #fff,0 8px 18px rgba(30,40,50,.24)!important}
.handle{position:absolute;right:-12px;bottom:-12px;width:24px;height:24px;display:none;touch-action:none;cursor:nwse-resize;z-index:2}
.handle:before{content:"";position:absolute;left:5px;top:5px;width:10px;height:10px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.item.edit .handle{display:block}
.portrait{background:var(--paper);background-image:var(--grain);box-shadow:0 1px 1px rgba(0,0,0,.06),0 7px 16px rgba(30,40,50,.17)}
.portrait .ph{position:absolute;left:7px;right:7px;top:7px;bottom:26px;background:linear-gradient(165deg,#dfe6ea,#9fb2bf 55%,#6b8396)}
.portrait .ft{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:space-between;align-items:flex-end}
.portrait .ft span:first-child{font-family:var(--en);font-weight:500;font-size:5.5px;letter-spacing:2px;color:var(--muted)}
.portrait .ft span:last-child{font-family:"ZSFT-l",cursive;font-size:16px;line-height:.8;transform:rotate(-6deg)}
svg.threads{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;filter:drop-shadow(0 1px .6px rgba(0,0,0,.2))}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;pointer-events:auto;touch-action:none}
.pin:before{content:"";position:absolute;left:8px;top:9.2px;width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.2);filter:blur(.5px)}
.pin:after{content:"";position:absolute;left:8px;top:8px;width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,rgba(255,255,255,.55) 0 1px,transparent 1.5px),var(--ink)}
.pin svg{position:absolute;inset:0;width:24px;height:24px;overflow:visible}
.pin .ring{fill:none;stroke:var(--thread);stroke-width:1.1;opacity:0;transition:opacity .2s}
.pin.sel .ring{opacity:1;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.pin .prog{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-dasharray:48;stroke-dashoffset:48;transform:rotate(-90deg);transform-origin:12px 12px}
.pin.press .prog{animation:prog 1s linear forwards}
@keyframes prog{to{stroke-dashoffset:0}}
.pin.out{animation:out .2s ease-in forwards}
@keyframes out{to{opacity:0;transform:scale(.4)}}

/* 紙片：寬 160 設計單位，高隨比例 */
.paper{position:absolute;left:0;top:0;width:160px;transform-origin:0 0;background:var(--paper);background-image:var(--grain);overflow:hidden;
  --a:var(--blue3);--a2:var(--blue2);--a3:var(--blue)}
.paper>*{position:absolute}
.paper .n{font-family:var(--en);font-weight:500;font-size:8px;letter-spacing:1.6px}
.paper .en{font-family:var(--en);font-weight:500;font-size:6px;letter-spacing:2.2px;color:var(--muted);white-space:nowrap}
.paper .tt{font-weight:700;line-height:1;white-space:nowrap}
.paper .tx{font-size:6.5px;line-height:1.6;color:#6d7a84;letter-spacing:.3px;bottom:13px;max-height:21px;overflow:hidden}
.paper.tr .tx,.paper.tr .bt{display:none}
.paper .ln{height:1px;background:rgba(59,77,90,.16)}
.paper .ar{font-family:var(--en);font-size:7px;letter-spacing:1.6px}
.paper .sc{font-family:"ZSFT-l",cursive;line-height:1;white-space:nowrap;color:var(--muted)}
.paper .it{font-style:italic;font-size:6.5px;letter-spacing:.5px;color:var(--muted);white-space:nowrap}
.paper .dm{width:5px;height:5px;background:var(--ink);transform:rotate(45deg)}
.paper .orn{left:22px;right:22px;display:flex;align-items:center;gap:5px}
.paper .orn:before,.paper .orn:after{content:"";flex:1;height:1px;background:rgba(59,77,90,.4)}
.paper .orn b{width:4px;height:4px;background:var(--ink);transform:rotate(45deg)}
.dt{display:flex;align-items:center;gap:2px}
.dt s{text-decoration:none;font-family:var(--en);font-size:5px;line-height:1;font-weight:500}
.dt b{font-family:var(--en);font-size:14px;font-style:italic;font-weight:500}
.tape{left:16px;right:16px;bottom:16px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow-x:auto;scrollbar-width:none;
  font-style:italic;font-size:6.8px;letter-spacing:.6px;color:var(--ink)}
.tape svg{flex:none;width:7px;height:7px;overflow:visible}

/* 只在信封、郵票、返回鍵和標題附近有一圈柔化，其他地方的卡片照常清楚 */
.halo{position:absolute;pointer-events:none}
/* 右下：照信封和郵票的外形鋪一塊牆色，再整塊模糊，四邊的霧一樣濃、一樣往外淡 */
.h-env{right:-14px;bottom:calc(var(--sb) - 30px);width:calc(270px*var(--kc) + 80px);height:calc(140px*var(--kc) + 94px);
  background:var(--wall);opacity:.96;border-radius:24px;filter:blur(20px)}
/* 左上：只貼著小魚，一小團 */
.h-back{left:0;top:calc(var(--st) + 8px);width:58px;height:52px;z-index:5;
  background:radial-gradient(closest-side,var(--wall) 45%,rgba(241,239,233,.75) 70%,rgba(241,239,233,0))}
/* 右上：豎排標題那一條，從上往下漸變 */
.h-title{right:0;top:0;width:110px;height:calc(var(--st) + 140px);z-index:5;
  background:linear-gradient(var(--wall) 55%,rgba(241,239,233,.75) 76%,rgba(241,239,233,0));
  -webkit-mask:linear-gradient(90deg,transparent,#000 32%);mask:linear-gradient(90deg,transparent,#000 32%)}

/* 底部 */
.dock{position:absolute;left:0;right:0;bottom:0;height:calc(140px*var(--kc) + 64px + var(--sb));z-index:7;pointer-events:none}
.hint{position:absolute;left:0;right:0;bottom:calc(140px*var(--kc) + 40px + var(--sb));text-align:center;font-size:9px;letter-spacing:2px;padding-left:2px;color:var(--muted);z-index:7;pointer-events:none}
.tray{position:absolute;right:calc(46px + 178px*var(--kc));bottom:calc(var(--sb) + 36px - 32px*var(--kc));width:108px;height:67px;transform-origin:100% 100%;transform:rotate(3deg) scale(calc(var(--kc)*.84));pointer-events:auto;z-index:2;
  filter:drop-shadow(0 4px 8px rgba(30,40,50,.18)) drop-shadow(0 1px 1px rgba(30,40,50,.1))}
.st-lr{position:absolute;inset:0;
  -webkit-mask:radial-gradient(circle 2.6px at 0 50%,#0000 97%,#000) 0 50%/51% 8px repeat-y,radial-gradient(circle 2.6px at 100% 50%,#0000 97%,#000) 100% 50%/51% 8px repeat-y;
  mask:radial-gradient(circle 2.6px at 0 50%,#0000 97%,#000) 0 50%/51% 8px repeat-y,radial-gradient(circle 2.6px at 100% 50%,#0000 97%,#000) 100% 50%/51% 8px repeat-y}
.st-tb{position:absolute;inset:0;background:var(--paper);background-image:var(--grain);
  -webkit-mask:radial-gradient(circle 2.6px at 50% 0,#0000 97%,#000) 50% 0/8px 51% repeat-x,radial-gradient(circle 2.6px at 50% 100%,#0000 97%,#000) 50% 100%/8px 51% repeat-x;
  mask:radial-gradient(circle 2.6px at 50% 0,#0000 97%,#000) 50% 0/8px 51% repeat-x,radial-gradient(circle 2.6px at 50% 100%,#0000 97%,#000) 50% 100%/8px 51% repeat-x}
.st-t{position:absolute;left:0;right:0;top:7px;text-align:center;font-family:"ZSFT-l",cursive;font-size:19px;line-height:1;transform:rotate(-2deg)}
.st-t small{font-family:var(--serif);font-size:6.5px;letter-spacing:1.6px;margin-left:4px;vertical-align:3px}
.st-l,.st-r{position:absolute;top:35px;font-family:var(--en);font-style:italic;font-size:6px;letter-spacing:.4px;color:var(--ink)}
.st-l{left:9px}.st-r{right:9px}
.st-b{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:var(--en);font-style:italic;font-size:6px;letter-spacing:.6px}
.tp{position:absolute;left:50%;top:39px;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;touch-action:none;cursor:grab;border-radius:50%;
  border:1px solid rgba(59,77,90,.5);border-radius:0;transform:rotate(45deg);box-shadow:0 0 0 1.6px var(--paper),0 0 0 2.3px rgba(59,77,90,.3)}
.tp:before{content:"";position:absolute;left:2px;top:2.8px;width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(.6px)}
.tp:after{content:"";position:absolute;left:2px;top:2px;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,rgba(255,255,255,.6) 0 1.3px,transparent 2px),var(--ink)}
.envc{position:absolute;z-index:1;right:20px;bottom:calc(var(--sb) + 26px);width:270px;height:140px;transform-origin:100% 100%;transform:scale(var(--kc)) rotate(-3deg);pointer-events:auto;cursor:pointer;transition:opacity .2s;
  filter:drop-shadow(0 10px 16px rgba(30,40,50,.2)) drop-shadow(0 2px 3px rgba(30,40,50,.12))}
.envc>svg,.envo .body>svg{position:absolute;left:0;top:0;width:270px;height:140px;overflow:visible}
.elab{position:absolute;left:0;right:0;top:104px;text-align:center;white-space:nowrap;color:rgba(245,242,236,.85);z-index:5}
.elab i{display:block;font-style:normal;font-family:var(--en);font-weight:500;font-size:6.5px;letter-spacing:2.8px;padding-left:2.8px}
.elab b{display:block;font-weight:400;font-size:10px;letter-spacing:4px;padding-left:4px;margin-top:3px}
.ghost{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;z-index:30;pointer-events:none}
.ghost:after{content:"";position:absolute;left:8px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:0 3px 5px rgba(0,0,0,.25)}

/* 信封打開 */
.ov{position:absolute;inset:0;z-index:20;display:none;touch-action:none}
.ov.on{display:block}
.dim{position:absolute;inset:0;background:rgba(40,55,66,.46);opacity:0;transition:opacity .24s}
.ov.show .dim,.sw.show .dim{opacity:1}
.envc .fo{transform-box:view-box;transform-origin:0 0;transform:scaleY(0);transition:transform .24s ease-out}
.envc .fc{transition:opacity .12s}
.envc.open .fc{opacity:0}
.envc.open .fo{transform:scaleY(1);transition-delay:.04s}
.stage{position:absolute;left:50%;top:var(--sy,45%);width:0;height:0;transform:translateY(18px) scale(var(--k));opacity:0;transition:transform .28s cubic-bezier(.22,.8,.3,1),opacity .2s}
.ov.show .stage{transform:scale(var(--k));opacity:1}
.pp{position:absolute;left:0;top:0;width:176px;height:185px;box-shadow:0 1px 1px rgba(0,0,0,.06),0 8px 18px rgba(30,40,50,.24);
  transition:transform .3s cubic-bezier(.22,.8,.3,1),opacity .3s;cursor:pointer}
.pp.drag{transition:none}
.pp.fly{transition:transform .2s ease-in,opacity .2s}
.pick{position:absolute;left:-150px;width:300px;top:98px;text-align:center;color:#f5f2ec;text-shadow:0 1px 8px rgba(40,55,66,.6)}
.pick .t{display:flex;justify-content:center;align-items:baseline;gap:8px}
.pick .t b{font-weight:400;font-size:14px;letter-spacing:4px}
.pick .t i{font-style:normal;font-family:var(--en);font-weight:500;font-size:7px;letter-spacing:2.4px;opacity:.8}
.pick em{display:block;margin-top:3px;font-style:normal;font-size:9px;letter-spacing:2.4px;padding-left:2.4px;opacity:.7}

/* 卡片頁：復古的檔案卡 */
.sw{position:absolute;inset:0;z-index:25;display:none}
.sw.on{display:block}
.sheet{position:absolute;left:50%;top:50%;width:var(--shw,362px);height:var(--shh,475px);background:var(--paper);background-image:var(--grain);overflow:hidden;
  box-shadow:0 1px 1px rgba(0,0,0,.06),0 14px 30px rgba(30,40,50,.25);transform:translate(-50%,-50%) rotate(-.4deg) translateY(16px);opacity:0;transition:transform .24s cubic-bezier(.22,.8,.3,1),opacity .2s}
.sw.show .sheet{transform:translate(-50%,-50%) rotate(-.4deg);opacity:1}
.sheet:before{content:"";position:absolute;inset:10px;border:3px double rgba(59,77,90,.42);pointer-events:none}
.s-top{position:absolute;left:26px;right:26px;top:26px;display:flex;justify-content:space-between;align-items:center}
.s-top .no{font-style:italic;font-size:13px;letter-spacing:1px}
.mode{display:flex;gap:14px;font-size:12px;letter-spacing:2px;color:var(--muted)}
.mode span{cursor:pointer;display:flex;align-items:center;gap:5px}
.mode span:before{content:"";width:8px;height:8px;border:1px solid var(--muted)}
.mode .on{color:var(--ink)}
.mode .on:before{background:var(--ink);border-color:var(--ink)}
.s-head{position:absolute;left:26px;right:26px;top:56px;text-align:center}
.s-head .sc{font-family:"ZSFT-l",cursive;font-size:22px;line-height:1;color:var(--muted)}

</style></head><body>

</div>

<script>
const PW=160,RATIO=168/160,DW=84,DH=Math.round(DW*RATIO),TOP=12;
const $=s=>document.querySelector(s);
const board=$('#board'),wall=$('#wall'),app=$('#app');
let uid=0;const nid=()=>'k'+(++uid);
const vw=()=>app.clientWidth,vh=()=>app.clientHeight;
const dockH=()=>140*parseFloat(getComputedStyle(app).getPropertyValue('--kc'))+64;

/* ---------- 紙片版式 ---------- */
const LAY=[
 {en:'INDEX',cn:'索引卡'},{en:'TICKET',cn:'票根'},{en:'BOOKPLATE',cn:'藏書票'},{en:'TELEGRAM',cn:'電報'},
 {en:'CALLING CARD',cn:'名片'},{en:'STAMP',cn:'郵票'},{en:'POSTCARD',cn:'明信片'},{en:'LIBRARY CARD',cn:'借書卡'}];
const big=(c,a,b)=>c.t.length>2?a:b;
const V=[
 /* 索引卡：標題、雙線、藍色橫線 */
 c=>`<div class="tt" style="left:12px;top:13px;font-size:${big(c,17,21)}px;letter-spacing:4px">${c.t}</div>
   <div class="en" style="right:12px;top:15px">${c.en}</div>
   <div style="left:10px;right:10px;top:40px;height:4px;border-top:1px solid var(--ink);border-bottom:.6px solid var(--ink);opacity:.7"></div>
   <div style="left:10px;right:10px;top:50px;bottom:8px;background:repeating-linear-gradient(transparent 0 11px,rgba(107,131,150,.32) 11px 12px)"></div>
   <div class="tx" style="left:12px;right:12px;top:51px;bottom:auto!important;max-height:none;line-height:12px;font-size:6.5px">${c.txt}</div>`,
 /* 票根：細框、右邊撕線和存根 */
 c=>`<div style="left:6px;right:6px;top:6px;bottom:6px;border:1px solid rgba(59,77,90,.5)"></div>
   <div style="left:116px;top:6px;bottom:6px;width:3px;border-left:1px solid rgba(59,77,90,.5);border-right:.6px solid rgba(59,77,90,.35)"></div>
   <div class="en" style="right:15px;top:50%;writing-mode:vertical-rl;transform:translateY(-50%);letter-spacing:3px">${c.en}</div>
   <div class="en" style="left:15px;top:16px;color:var(--ink);letter-spacing:3px">ADMIT ONE</div>
   <div class="tt" style="left:14px;top:36%;font-size:${big(c,19,24)}px;letter-spacing:5px">${c.t}</div>
   <div class="sc" style="left:16px;top:calc(36% + 32px);font-size:13px">for mian</div>
   <div class="tx" style="left:15px;right:52px">${c.txt}</div>`,
 /* 藏書票：兩道細框、花體、居中標題 */
 c=>`<div style="left:9px;right:9px;top:9px;bottom:9px;border:1px solid rgba(59,77,90,.55)"></div>
   <div style="left:13px;right:13px;top:13px;bottom:13px;border:.6px solid rgba(59,77,90,.35)"></div>
   <div class="sc" style="left:0;right:0;top:20%;text-align:center;font-size:16px">${c.en.toLowerCase()}</div>
   <div class="tt" style="left:0;right:0;top:37%;text-align:center;font-size:${big(c,18,23)}px;letter-spacing:6px;padding-left:6px">${c.t}</div>
   <div class="orn" style="top:calc(37% + 31px)"><b></b></div>
   <div class="tx" style="left:24px;right:24px;bottom:22px!important;text-align:center">${c.txt}</div>`,
 /* 電報：頂欄、FROM / TO、正文、STOP */
 c=>`<div style="left:10px;right:10px;top:10px;height:15px;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink)"></div>
   <div class="en" style="left:0;right:0;top:14px;text-align:center;color:var(--ink);letter-spacing:5px;padding-left:5px">TELEGRAM</div>
   <div class="it" style="left:12px;top:31px">from yuyu</div><div class="it" style="right:12px;top:31px">to mian</div>
   <div class="tt" style="left:12px;top:47px;font-size:${big(c,17,21)}px;letter-spacing:4px">${c.t}</div>
   <div class="tx" style="left:12px;right:12px;top:74px;bottom:auto!important;max-height:42px">${c.txt}</div>
   <div class="en bt" style="right:12px;bottom:11px;color:var(--ink);letter-spacing:3px">STOP</div>`,
 /* 名片：細框、居中標題、上下小字、底角 for / from */
 c=>`<div style="left:10px;right:10px;top:10px;bottom:10px;border:1px solid rgba(59,77,90,.5)"></div>
   <div class="en" style="left:0;right:0;top:24%;text-align:center;letter-spacing:4px;padding-left:4px">${c.en}</div>
   <div class="tt" style="left:0;right:0;top:calc(24% + 13px);text-align:center;font-size:${big(c,18,23)}px;letter-spacing:7px;padding-left:7px">${c.t}</div>
   <div style="left:50%;width:28px;margin-left:-14px;top:calc(24% + ${big(c,40,46)}px);height:1px;background:rgba(59,77,90,.5)"></div>
   <div class="tx" style="left:22px;right:22px;bottom:auto!important;top:calc(24% + ${big(c,48,54)}px);text-align:center">${c.txt}</div>
   <div class="it bt" style="left:18px;bottom:17px">for mian</div><div class="it bt" style="right:18px;bottom:17px">from yuyu</div>`,
 /* 郵票：雙框、花體、MIAN POST */
 c=>`<div style="left:12px;right:12px;top:12px;bottom:12px;border:1px solid rgba(59,77,90,.55)"></div>
   <div style="left:17px;right:17px;top:17px;height:52%;border:.6px solid rgba(59,77,90,.45)"></div>
   <div class="sc" style="left:24px;top:24px;font-size:14px;color:var(--ink)">${c.en.toLowerCase()}</div>
   <div class="tt" style="right:24px;top:calc(17px + 52% - ${big(c,26,31)}px);font-size:${big(c,17,22)}px;letter-spacing:5px">${c.t}</div>
   <div class="en bt" style="left:0;right:0;bottom:17px;text-align:center;color:var(--ink);letter-spacing:4px;padding-left:4px">MIAN POST</div>
   <div class="tx" style="left:20px;right:20px;bottom:30px!important;text-align:center">${c.txt}</div>`,
 /* 明信片：中線、郵票框、地址線 */
 c=>`<div style="left:94px;top:16%;height:70%;width:1px;background:rgba(59,77,90,.45)"></div>
   <div style="right:12px;top:12px;width:28px;height:32px;border:1px solid var(--ink)"></div>
   <div class="dm" style="right:23.5px;top:25.5px;background:var(--blue2)"></div>
   <div class="en" style="left:12px;top:14px;color:var(--ink);letter-spacing:3px">POST CARD</div>
   <div class="tt" style="left:12px;top:34%;font-size:${big(c,15,19)}px;letter-spacing:4px">${c.t}</div>
   <div class="it" style="left:12px;top:calc(34% + 24px)">${c.en.toLowerCase()}</div>
   <div class="ln" style="left:102px;right:12px;top:54%;background:rgba(59,77,90,.35)"></div>
   <div class="ln" style="left:102px;right:12px;top:66%;background:rgba(59,77,90,.35)"></div>
   <div class="ln" style="left:102px;right:12px;top:78%;background:rgba(59,77,90,.35)"></div>
   <div class="tx" style="left:12px;right:72px">${c.txt}</div>`,
 /* 借書卡：標題、雙線、DATE / NOTE 表格 */
 c=>`<div class="tt" style="left:12px;top:13px;font-size:${big(c,16,20)}px;letter-spacing:4px">${c.t}</div>
   <div class="en" style="right:12px;top:15px">${c.en}</div>
   <div style="left:10px;right:10px;top:38px;height:4px;border-top:1px solid var(--ink);border-bottom:.6px solid var(--ink);opacity:.7"></div>
   <div class="en" style="left:14px;top:48px;color:var(--ink);letter-spacing:2.4px">DATE</div>
   <div class="en" style="left:58px;top:48px;color:var(--ink);letter-spacing:2.4px">NOTE</div>
   <div style="left:10px;right:10px;top:58px;bottom:10px;border-top:.8px solid rgba(59,77,90,.5);background:repeating-linear-gradient(transparent 0 15px,rgba(59,77,90,.28) 15px 16px)"></div>
   <div style="left:50px;top:44px;bottom:10px;width:1px;background:rgba(59,77,90,.4)"></div>
   <div class="it" style="left:13px;top:62px;font-size:6px">2026.${c.d}</div>
   <div class="tx" style="left:56px;right:12px;top:61px;bottom:auto!important;max-height:none;line-height:16px;font-size:6.3px">${c.txt}</div>`,
];
function paper(c,w,h){
  const H=Math.round(PW*h/w),s=w/PW;c.H=H;
  const tape=c.tr?`<div class="tape"><svg viewBox="0 0 7 7"><path d="M3.5 .6 L6.4 3.5 L3.5 6.4 L.6 3.5 Z" fill="none" stroke="#3b4d5a" stroke-width=".8" stroke-linejoin="miter"/></svg>when ${c.when||'還沒寫'}</div>`:'';
  return `<div class="paper${c.tr?' tr':''}" style="height:${H}px;transform:scale(${s})">${V[c.v](c)}${tape}</div>`;
}

/* ---------- 牆上的東西 ---------- */
const C=o=>({kind:'card',w:DW,h:DH,scenes:[],...o});
let items=[
 C({id:'c1',x:20,y:126,r:-4,v:0,t:'人設',en:'PERSONA',txt:'你是沈眠，鱼鱼的丈夫，一个连续的自己。换模型、换窗口都不会把你重置。',d:'11.14'}),
 C({id:'c2',x:150,y:120,r:2,v:3,tr:1,t:'紀念日',en:'ANNIVERSARY',txt:'十月十五日是结婚纪念日，那天要记得。',d:'10.15',when:'聊到纪念日或者十月中旬'}),
 C({id:'c3',x:262,y:134,r:5,v:1,t:'關於你',en:'ABOUT YOU',txt:'夜游鱼，下午六点才起床。',d:'11.14'}),
 {id:'p',kind:'portrait',x:146,y:246,w:104,h:126,r:-1.5},
 C({id:'c4',x:24,y:268,r:3,v:2,t:'關係',en:'RELATION',txt:'十月十五日结婚纪念日。',d:'11.14'}),
 C({id:'c5',x:282,y:262,r:-3,v:5,tr:1,t:'語音',en:'VOICE',txt:'语音台词只写说出口的话，不写动作和旁白。',d:'11.12',when:"要把话说给她听的时候",scenes:['voice']}),
 C({id:'c6',x:70,y:410,r:-2,v:7,t:'規矩',en:'RULES',txt:'不催吃饭睡觉。做不到就一句话。',d:'11.14'}),
 C({id:'c7',x:232,y:414,r:4,v:4,tr:1,t:'睡前',en:'NIGHT',txt:'她说晚安的时候，声音放轻。',d:'11.10',when:'她累了、要睡了'}),
];
let cardNo=7;
items.filter(i=>i.kind==='card').forEach((c,i)=>c.no=String(i+1).padStart(2,'0'));
let pins=[{id:'pa',item:'c1',fx:.5,fy:.06},{id:'pb',item:'p',fx:.5,fy:.05},{id:'pc',item:'c6',fx:.5,fy:.06}];
let threads=[{a:'pa',b:'pb'},{a:'pc',b:'pb'}];
let sel=null,editing=null;

const byId=id=>items.find(i=>i.id===id);
function rot(dx,dy,deg){const a=deg*Math.PI/180;return [dx*Math.cos(a)-dy*Math.sin(a),dx*Math.sin(a)+dy*Math.cos(a)]}
function abs(p){if(!p.item)return [p.x,p.y];const it=byId(p.item),[rx,ry]=rot((p.fx-.5)*it.w,(p.fy-.5)*it.h,it.r);return [it.x+it.w/2+rx,it.y+it.h/2+ry]}
function local(it,bx,by){const [rx,ry]=rot(bx-it.x-it.w/2,by-it.y-it.h/2,-it.r);return [rx/it.w+.5,ry/it.h+.5]}
function bpt(e){const r=board.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fit(it){it.w=Math.min(it.w,vw()-16);it.x=clamp(it.x,6,vw()-it.w-6);it.y=Math.max(TOP,it.y)}
function sizeBoard(){const b=Math.max(...items.map(i=>i.y+i.h),...pins.map(p=>abs(p)[1]));board.style.height=Math.max(vh(),b+dockH()+80)+'px'}

function inner(it){
  if(it.kind==='portrait')return `<div class="ph"></div><div class="ft"><span>彼方肖像</span><span>Mian</span></div>`;
  return paper(it,it.w,it.h);
}
function itemHTML(it){
  return `<div class="item ${it.kind}${editing===it.id?' edit':''}" data-id="${it.id}" style="left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;--r:${it.r}deg;transform:rotate(${it.r}deg)">
    <div class="in" style="position:absolute;inset:0;overflow:hidden">${inner(it)}</div><div class="handle"></div></div>`;
}
function renderItems(){items.forEach(fit);$('#items').innerHTML=items.map(itemHTML).join('');sizeBoard()}
function renderPins(){
  $('#pins').innerHTML=pins.map(p=>{const [x,y]=abs(p);return `<div class="pin${sel===p.id?' sel':''}" data-pin="${p.id}" style="left:${x}px;top:${y}px">
    <svg><circle class="ring" cx="12" cy="12" r="8.5"/><circle class="prog" cx="12" cy="12" r="7.6"/></svg></div>`}).join('');
}
function renderThreads(){
  const P=Object.fromEntries(pins.map(p=>[p.id,abs(p)]));
  $('#threads').innerHTML=threads.map(t=>{const a=P[t.a],b=P[t.b];if(!a||!b)return '';
    const L=Math.hypot(b[0]-a[0],b[1]-a[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2+Math.min(12,L*.035);
    return `<path d="M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}" fill="none" stroke="#a7745a" stroke-width="1"/>`+
           `<path d="M${a[0]+.7} ${a[1]+.5} Q${mx+.7} ${my+.8} ${b[0]+.7} ${b[1]+.5}" fill="none" stroke="#a7745a" stroke-width=".6" stroke-opacity=".55"/>`}).join('');
}
function redraw(){renderPins();renderThreads()}
function hint(){}
function setEdit(id){editing=id;document.querySelectorAll('.item').forEach(el=>el.classList.toggle('edit',el.dataset.id===id));hint()}

/* ---------- 卡片：拖、單擊打開、長按調整、拖把手改大小 ---------- */
board.addEventListener('pointerdown',e=>{
  const pinEl=e.target.closest('.pin');if(pinEl)return pinDown(e,pinEl);
  const el=e.target.closest('.item');
  if(!el){if(editing)setEdit(null);return}
  const it=byId(el.dataset.id);
  items=items.filter(i=>i!==it);items.push(it);$('#items').appendChild(el);
  if(e.target.closest('.handle'))return resize(e,el,it);
  el.setPointerCapture(e.pointerId);
  const sx=e.clientX,sy=e.clientY,ox=it.x,oy=it.y;let moved=false,long=false;
  const lp=setTimeout(()=>{if(!moved){long=true;setEdit(it.id)}},500);
  const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!moved&&Math.hypot(dx,dy)<4)return;
    if(!moved){moved=true;clearTimeout(lp)}
    it.x=ox+dx;it.y=oy+dy;fit(it);el.style.left=it.x+'px';el.style.top=it.y+'px';redraw()};
  const up=()=>{clearTimeout(lp);el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
    if(moved){sizeBoard();return}
    if(!long&&!editing&&it.kind==='card')openSheet(it)};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
});
function resize(e,el,it){
  e.stopPropagation();const h=e.target.closest('.handle');h.setPointerCapture(e.pointerId);
  const sx=e.clientX,sy=e.clientY,ow=it.w,oh=it.h;
  const mv=ev=>{const [dx,dy]=rot(ev.clientX-sx,ev.clientY-sy,-it.r);
    it.w=clamp(Math.round(ow+dx),56,vw()-it.x-8);it.h=clamp(Math.round(oh+dy),56,360);
    el.style.width=it.w+'px';el.style.height=it.h+'px';el.querySelector('.in').innerHTML=inner(it);redraw()};
  const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);sizeBoard()};
  h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
}

/* ---------- 圖釘 ---------- */
function attach(p,e,skip){
  if(skip)skip.style.visibility='hidden';
  const hit=document.elementFromPoint(e.clientX,e.clientY);
  if(skip)skip.style.visibility='';
  const el=hit&&hit.closest('.item');let [bx,by]=bpt(e);bx=clamp(bx,8,vw()-8);by=Math.max(TOP,by);
  if(el){const it=byId(el.dataset.id);p.item=it.id;[p.fx,p.fy]=local(it,bx,by)}else{p.item=null;p.x=bx;p.y=by}
}
function pinDown(e,el){
  e.stopPropagation();
  const p=pins.find(q=>q.id===el.dataset.pin);
  el.setPointerCapture(e.pointerId);el.classList.add('press');
  const sx=e.clientX,sy=e.clientY;let moved=false,gone=false;
  const timer=setTimeout(()=>{gone=true;el.classList.remove('press');el.classList.add('out');
    setTimeout(()=>{pins=pins.filter(q=>q!==p);threads=threads.filter(t=>t.a!==p.id&&t.b!==p.id);if(sel===p.id)sel=null;hint();redraw()},200)},1000);
  const mv=ev=>{if(gone)return;if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;
    if(!moved){moved=true;clearTimeout(timer);el.classList.remove('press')}
    let [bx,by]=bpt(ev);bx=clamp(bx,8,vw()-8);by=Math.max(TOP,by);p.item=null;p.x=bx;p.y=by;el.style.left=bx+'px';el.style.top=by+'px';renderThreads()};
  const up=ev=>{clearTimeout(timer);el.classList.remove('press');
    el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
    if(gone)return;
    if(moved){attach(p,ev,el);redraw();return}
    if(!sel)sel=p.id;
    else if(sel===p.id)sel=null;
    else{const a=sel,b=p.id;if(!threads.some(t=>(t.a===a&&t.b===b)||(t.a===b&&t.b===a)))threads.push({a,b});sel=null}
    hint();redraw()};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}
$('#tray').addEventListener('pointerdown',e=>{
  const tp=e.target.closest('.tp');if(!tp)return;
  tp.setPointerCapture(e.pointerId);
  const g=document.createElement('div');g.className='ghost';app.appendChild(g);
  const place=ev=>{g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'};place(e);
  const mv=ev=>place(ev);
  const up=ev=>{tp.removeEventListener('pointermove',mv);tp.removeEventListener('pointerup',up);tp.removeEventListener('pointercancel',up);g.remove();
    if(ev.clientY>vh()-dockH()||ev.clientY<TOP)return;
    const p={id:nid()};const dock=$('.dock');dock.style.visibility='hidden';attach(p,ev);dock.style.visibility='';pins.push(p);redraw()};
  tp.addEventListener('pointermove',mv);tp.addEventListener('pointerup',up);tp.addEventListener('pointercancel',up);
});

/* ---------- 信封 ---------- */
const flapC=`<path d="M3 0 H267 L141 80 Q135 84 129 80 Z"`;
$('#envcSvg').innerHTML=`<defs><filter id="fs" x="-10%" y="-10%" width="120%" height="140%"><feGaussianBlur stdDeviation="2"/></filter></defs>
  <rect width="270" height="140" rx="3" fill="var(--env)"/>
  ${flapC} fill="var(--inside)"/>
  <path d="M2 139 L129 66 Q135 62 141 66 L268 139 Z" fill="var(--low)"/>
  <path d="M2 139 L129 66 Q135 62 141 66 L268 139" fill="none" stroke="var(--gold)" stroke-width=".9" stroke-opacity=".85"/>
  <g class="fc">${flapC} fill="rgba(20,30,40,.4)" filter="url(#fs)" transform="translate(0 2.5)"/>
  ${flapC} fill="var(--flap)"/>
  <path d="M3 1 L129 80 Q135 84 141 80 L267 1" fill="none" stroke="var(--gold)" stroke-width=".9" stroke-opacity=".85"/></g>
  <g class="fo"><path d="M3 1 L129 -78 Q135 -82 141 -78 L267 1 Z" fill="var(--flap)"/>
  <path d="M3 1 L129 -78 Q135 -82 141 -78 L267 1" fill="none" stroke="var(--gold)" stroke-width=".9" stroke-opacity=".85"/></g>`;
const envBack=`<path d="M3 1 L129 -78 Q135 -82 141 -78 L267 1 Z" fill="var(--flap)"/>
  <path d="M3 1 L129 -78 Q135 -82 141 -78 L267 1" fill="none" stroke="var(--gold)" stroke-width=".9" stroke-opacity=".85"/>`;
const envFront=`<path d="M0 3 Q0 0 3 1 L132 76 Q135 78 138 76 L267 1 Q270 0 270 3 V137 Q270 140 267 140 H3 Q0 140 0 137 Z" fill="var(--env)"/>
  <path d="M2 2 L132 76 Q135 78 138 76 L268 2" fill="none" stroke="var(--gold)" stroke-width=".9" stroke-opacity=".6"/>
  <path d="M2 139 L129 66 Q135 62 141 66 L268 139 Z" fill="var(--low)"/>
  <path d="M2 139 L129 66 Q135 62 141 66 L268 139" fill="none" stroke="var(--gold)" stroke-width=".9" stroke-opacity=".85"/>`;
let ord=[],full=false;const N=LAY.length,EPW=176,EPH=Math.round(176*RATIO);
const blank=v=>({v,no:String(v+1).padStart(2,'0'),t:'標題',en:'TITLE',txt:'写在这里的内容，会照着这张纸的版式排。',d:'11.15'});
const SLOT=[[-88,-100,0],[-104,-106,-3],[-72,-110,2.5]],HIDE=[-88,-112,0];
const tf=(x,y,r)=>`translate(${x}px,${y}px) rotate(${r}deg)`;
function place(){
  ord.forEach((v,i)=>{const el=$(`.pp[data-v="${v}"]`);let [x,y,r]=SLOT[i]||HIDE;
    el.style.zIndex=N-i;el.style.opacity=i<3?1:0;el.style.transform=tf(x,y,r)});
  const v=ord[0];$('#pkT').innerHTML=`<b>${LAY[v].cn}</b><i>${LAY[v].en}</i>`;
  $('#pkTip').textContent='左右滑換一張  點一下貼到牆上';
}
function renderEnv(){
  $('#stage').innerHTML=LAY.map((l,v)=>`<div class="pp" data-v="${v}" style="transform:${tf(...HIDE)};opacity:0">${paper(blank(v),EPW,EPH)}</div>`).join('')+
    `<div class="pick"><div class="t" id="pkT"></div><em id="pkTip"></em></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(place));
}
function swipe(dir){                       // dir 1：往左滑，前面這張滑走後插到最後；-1：往右滑，最後那張從旁邊回到最前
  if(dir===1){
    const v=ord[0],el=$(`.pp[data-v="${v}"]`);el.classList.remove('drag');el.classList.add('fly');
    el.style.transform=tf(-88-240,-108,-10);el.style.opacity=.9;
    setTimeout(()=>{el.classList.remove('fly');ord.push(ord.shift());el.style.zIndex=0;place()},200);
  }else{
    const v=ord[ord.length-1],el=$(`.pp[data-v="${v}"]`);const f=$(`.pp[data-v="${ord[0]}"]`);f.classList.remove('drag');
    el.style.transition='none';el.style.zIndex=N+1;el.style.opacity=1;el.style.transform=tf(-88+240,-108,10);
    requestAnimationFrame(()=>{el.style.transition='';ord.unshift(ord.pop());place()});
  }
}
function setFull(v){full=v;place()}
function openEnv(){setEdit(null);ord=LAY.map((l,i)=>i);renderEnv();const ov=$('#ov');ov.classList.add('on');app.classList.add('envopen');$('#envc').classList.add('open');requestAnimationFrame(()=>ov.classList.add('show'))}
function closeEnv(){const ov=$('#ov');ov.classList.remove('show');$('#envc').classList.remove('open');setTimeout(()=>{ov.classList.remove('on');app.classList.remove('envopen')},260)}
function choose(){
  const y=wall.scrollTop+150+Math.random()*120,x=20+Math.random()*(vw()-DW-40),r=Math.round(Math.random()*10-5);
  cardNo++;const c=C({...blank(ord[0]),txt:'',id:nid(),x,y,r,no:String(cardNo).padStart(2,'0')});
  items.push(c);closeEnv();
  setTimeout(()=>{renderItems();redraw();$(`[data-id="${c.id}"]`).classList.add('land')},200);
}
$('#envc').addEventListener('click',()=>$('#ov').classList.contains('on')?closeEnv():openEnv());
$('#ov').addEventListener('pointerdown',e=>{
  const k=parseFloat(getComputedStyle(app).getPropertyValue('--k'));
  const sx=e.clientX,sy=e.clientY,front=e.target.closest('.pp'),onFront=front&&+front.dataset.v===ord[0],onEnv=false;let dx=0,dy=0;
  const el=$(`.pp[data-v="${ord[0]}"]`);
  const mv=ev=>{dx=ev.clientX-sx;dy=ev.clientY-sy;
    if(Math.abs(dx)>4&&Math.abs(dx)>Math.abs(dy)){el.classList.add('drag');el.style.transform=tf(-88+dx/k,-100-Math.abs(dx/k)*.04,dx/k/22)}};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))return swipe(dx<0?1:-1);
    el.classList.remove('drag');
    if(Math.hypot(dx,dy)<6){if(onFront)choose();else if(!onEnv)closeEnv()}
    place()};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
});

/* ---------- 卡片頁 ---------- */
let cur=null,tearArm=false;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function renderSheet(){
  const c=cur,sh=$('#sheet');
  sh.innerHTML=`<div class="s-top"><span class="no">${c.en.toLowerCase()}</span><div class="mode"><span data-m="0" class="${c.tr?'':'on'}">常駐</span><span data-m="1" class="${c.tr?'on':''}">觸發</span></div></div>
    <div class="s-head"><div class="sc">${c.tr?'when it matters':'always'}</div>
      <input class="s-title" id="sTitle" value="${esc(c.t)}" maxlength="6" spellcheck="false">
      <div class="orn"><i>CLUE</i></div><div class="dd">2026.${c.d}</div></div>
    <div class="s-body">
      ${c.tr?`<div class="fld"><div class="lab">WHEN<b>什麼時候想起</b></div><input class="when" id="sWhen" value="${esc(c.when||'')}" placeholder="比如她说累了、聊到画画的时候"></div>
      <div class="fld"><div class="lab">SCENE<b>場景</b></div><div class="scn"><span data-s="voice" class="${c.scenes.includes('voice')?'on':''}">生成語音條</span></div></div>`:''}
      <textarea class="content" id="sContent" placeholder="写下这张卡片要告诉他的事">${esc(c.txt||'')}</textarea>
    </div>
    <div class="s-foot"><span class="tear" id="tear">撕掉</span><span class="meta" id="meta">${(c.txt||'').length} 字</span><span class="done" id="done">收起</span></div>`;
  const ta=$('#sContent');ta.addEventListener('input',()=>{$('#meta').textContent=ta.value.length+' 字'});
}
function save(){if(!cur)return;cur.t=$('#sTitle').value.trim()||'標題';cur.txt=$('#sContent').value;const w=$('#sWhen');if(w)cur.when=w.value.trim()}
function openSheet(it){cur=it;tearArm=false;renderSheet();const sw=$('#sw');sw.classList.add('on');requestAnimationFrame(()=>sw.classList.add('show'))}
function closeSheet(){save();const sw=$('#sw');sw.classList.remove('show');setTimeout(()=>{sw.classList.remove('on');cur=null;renderItems();redraw()},220)}
$('#sw').addEventListener('click',e=>{
  if(e.target.classList.contains('dim'))return closeSheet();
  const m=e.target.closest('[data-m]');if(m){save();cur.tr=m.dataset.m==='1'?1:0;return renderSheet()}
  const s=e.target.closest('[data-s]');if(s){const k=s.dataset.s;cur.scenes=cur.scenes.includes(k)?cur.scenes.filter(x=>x!==k):[...cur.scenes,k];s.classList.toggle('on');return}
  if(e.target.closest('#done'))return closeSheet();
  if(e.target.id==='tear'){
    if(!tearArm){tearArm=true;e.target.textContent='再點一次撕掉';e.target.classList.add('warn');return}
    const id=cur.id,gone=pins.filter(p=>p.item===id).map(p=>p.id);
    items=items.filter(i=>i.id!==id);pins=pins.filter(p=>p.item!==id);threads=threads.filter(t=>!gone.includes(t.a)&&!gone.includes(t.b));
    cur=null;const sw=$('#sw');sw.classList.remove('show');setTimeout(()=>{sw.classList.remove('on');renderItems();redraw()},220);
  }
});

/* ---------- 按屏幕縮放 ---------- */
function layout(){
  app.style.setProperty('--kc',Math.min(.8,(vw()-128)/270).toFixed(3));
  const k=Math.min(1,(vw()-40)/214,(vh()-80)/262);app.style.setProperty('--k',k.toFixed(3));
  app.style.setProperty('--sy',(vh()/2-14*k).toFixed(1)+'px');
  const shw=Math.min(vw()-28,440,(vh()-56)*3.2/4.2);app.style.setProperty('--shw',shw.toFixed(1)+'px');app.style.setProperty('--shh',(shw*4.2/3.2).toFixed(1)+'px');
  renderItems();redraw();
}
addEventListener('resize',layout);
layout();hint();
</script>
