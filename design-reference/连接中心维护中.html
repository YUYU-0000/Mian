<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连接设置</title>
    <link rel="preload" href="https://fontsapi.zeoseven.com/br/main.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        /* ================= 基礎 ================= */
        @font-face {
            font-family: "ZSFT-br"; src: url("https://fontsapi.zeoseven.com/br/light.woff2") format("woff2");
            font-style: normal; font-weight: 300; font-display: swap;
        }
        @font-face {
            font-family: "ZSFT-br"; src: url("https://fontsapi.zeoseven.com/br/main.woff2") format("woff2");
            font-style: normal; font-weight: 400; font-display: swap;
        }
        @font-face {
            font-family: "ZSFT-br"; src: url("https://fontsapi.zeoseven.com/br/medium.woff2") format("woff2");
            font-style: normal; font-weight: 500; font-display: swap;
        }
        @font-face {
            font-family: "ZSFT-br"; src: url("https://fontsapi.zeoseven.com/br/semi-bold.woff2") format("woff2");
            font-style: normal; font-weight: 600; font-display: swap;
        }
        @font-face {
            font-family: "ZSFT-br"; src: url("https://fontsapi.zeoseven.com/br/bold.woff2") format("woff2");
            font-style: normal; font-weight: 700; font-display: swap;
        }

        :root {
            --env-h: 440px;
            --base-gap: 25px;
            --scale: 1.15;
            --sheet-w: min(82vw, 340px, calc(80svh * 3.2 / 4.2));
            --ink: #3b4d5a;
            --btn: #5a7082;
            --env1: #6b8396;
            --env2: #93a7b5;
            --sheet: #f5f2ec;
            --muted: #72828e;
            --grain: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.09"/></svg>');
            --paper-grain: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.05"/></svg>');
        }
        html { background-color: #e8e6df; }
        body {
            margin: 0; padding: 0 2vw 0 0;
            font-family: "ZSFT-br", sans-serif;
            width: 100%; min-height: 100vh;
            display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
            box-sizing: border-box; overflow-x: hidden; position: relative;
        }

        /* 左上角返回鍵 */
        .settings-header { position: absolute; top: 0; left: 0; padding: 12.5px 16px; z-index: 10; }
        .back-btn { display: inline-flex; align-items: flex-start; cursor: pointer; position: relative; transition: transform .2s ease, opacity .2s ease; }
        .back-btn::after { content: ''; position: absolute; inset: -10px -15px; }
        .back-btn:active { opacity: .6; transform: translateX(-4px); }

        /* ================= 檔案袋 ================= */
        .envelope {
            width: min(312px, calc(100vw - 32px));
            height: var(--env-h);
            position: relative; box-sizing: border-box; cursor: pointer;
            border-radius: 2px;
            box-shadow: -12px 20px 38px rgba(90,112,130,.22), -3px 6px 10px rgba(0,0,0,.08);
            transform: scale(var(--scale)); transform-origin: right top;
            /* 選取時顯示米白細框。 */
            outline: 0.6px solid transparent; outline-offset: 0;
            transition: transform .2s ease, box-shadow .2s ease, outline-color .3s ease;
        }
        .envelope::before { /* 紙紋 */
            content: ''; position: absolute; inset: 0; z-index: 8; pointer-events: none; border-radius: 2px;
            background: var(--grain); mix-blend-mode: multiply;
        }
        @media (hover: hover) {
            .envelope:hover {
                transform: translateY(calc(-4px / var(--scale))) scale(var(--scale));
                box-shadow: -20px 35px 55px rgba(90,112,130,.35), -6px 15px 22px rgba(0,0,0,.15);
            }
        }
        .envelope.is-active {
            transform: translateY(calc(-2px / var(--scale))) scale(var(--scale));
            box-shadow: -18px 30px 50px rgba(90,112,130,.3), -5px 12px 18px rgba(0,0,0,.12);
            outline-color: rgba(241,239,233,.95);
        }
        .envelope:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

        .env-first {
            background-color: var(--env1);
            z-index: 2; margin-top: 8px;
            margin-bottom: calc((var(--base-gap) * var(--scale)) - (var(--env-h) * (1 - var(--scale))));
        }
        .env-second {
            background-color: var(--env2);
            z-index: 1;
            margin-bottom: calc(0px - (var(--env-h) * (1 - var(--scale))));
        }

        /* 扣子和繩子 */
        .tie-btn {
            position: absolute; z-index: 10;
            width: 22px; height: 22px; border-radius: 50%;
            background-color: #516575;
            box-shadow: inset 0 1px 1px rgba(255,255,255,.18), inset 0 -1px 2px rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.18);
            display: flex; justify-content: center; align-items: center;
            transition: background-color .2s ease;
        }
        .tie-btn::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background-color: rgba(241,239,233,.7); }
        .env-second .tie-btn { background-color: #627683; }
        .tie-container-v, .tie-container-h { position: absolute; z-index: 10; cursor: pointer; }
        .tie-container-v { right: 100px; top: 50%; transform: translate(50%, -50%); width: 60px; height: 22px; }
        .tie-container-v .tie-btn:nth-child(1) { left: 0; }
        .tie-container-v .tie-btn:nth-child(2) { right: 0; }
        .tie-container-h { top: 69px; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 60px; }
        .tie-container-h .tie-btn:nth-child(1) { top: 0; left: 0; }
        .tie-container-h .tie-btn:nth-child(2) { bottom: 0; left: 0; }
        .string-svg-v, .string-svg-h { position: absolute; top: -2px; left: -2px; z-index: 9; pointer-events: none; overflow: visible; }
        .string-svg-v { width: 80px; height: 60px; }
        .string-svg-h { width: 60px; height: 80px; }
        @media (hover: hover) {
            .tie-container-v:hover .tie-btn, .tie-container-h:hover .tie-btn { background-color: #475a69; }
            .env-second .tie-container-h:hover .tie-btn { background-color: #556977; }
        }

        /* 訂閱袋：右側翻蓋與直排 CLOUD PLANS */
        .env-side-flap {
            position: absolute; top: 0; right: 0; bottom: 0; width: 100px; z-index: 1;
            background-color: var(--env1);
            border-left: 1px solid rgba(255,255,255,.08);
            box-shadow: -5px 0 14px rgba(0,0,0,.12);
            border-radius: 0 2px 2px 0;
        }
        .env1-title-container { position: absolute; left: -8px; top: 10px; width: 60px; z-index: 5; pointer-events: none; }
        .env1-title-text {
            position: absolute; left: 0; top: 0;
            transform-origin: left top; transform: rotate(90deg) translateY(-100%);
            white-space: nowrap;
            font-size: 52px; letter-spacing: 5px; font-weight: 400; color: rgba(241,239,233,.9);
        }
        .env1-title-text .maison { font-style: italic; font-weight: 300; margin-left: 15px; }

        /* API 袋：上方翻蓋與置中的 REMOTE CONNECT */
        .env-top-flap-wrapper {
            position: absolute; top: 0; left: 0; right: 0; height: 69px; z-index: 4;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,.12));
        }
        .env-top-flap {
            width: 100%; height: 100%;
            background-color: var(--env2);
            clip-path: polygon(0 0, 100% 0, 96% 100%, 4% 100%);
            border-radius: 3px 3px 0 0;
        }
        .env-top-flap::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: rgba(255,255,255,.12); }
        .env2-center-title {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; z-index: 5; pointer-events: none;
            font-size: 24px; color: rgba(241,239,233,.9);
        }
        .env2-center-title .forma { letter-spacing: 4px; font-weight: 400; margin-bottom: -4px; }
        .env2-center-title .maison { letter-spacing: 2px; font-style: italic; font-weight: 300; }
        .env2-footer {
            position: absolute; left: 20px; right: 20px; bottom: 16px; z-index: 5; pointer-events: none;
            display: flex; justify-content: space-between;
            font-size: 8px; letter-spacing: 2.5px; font-weight: 500; color: rgba(241,239,233,.55);
        }

        /* 按螢幕高度縮放檔案袋 */
        @media (max-height: 1080px) { :root { --scale: 1.10; } }
        @media (max-height: 1000px) { :root { --scale: 1.02; } }
        @media (max-height: 940px)  { :root { --scale: 0.96; } }
        @media (max-height: 880px)  { :root { --scale: 0.90; } }
        @media (max-height: 820px)  { :root { --scale: 0.84; } }
        @media (max-height: 760px)  { :root { --scale: 0.77; } }
        @media (max-height: 700px)  { :root { --scale: 0.71; } }
        @media (max-height: 640px)  { :root { --scale: 0.65; } }
        @media (max-height: 580px)  { :root { --scale: 0.59; } }
        @media (max-height: 520px)  { :root { --scale: 0.53; } }

        /* ================= 遮罩與紙堆 ================= */
        .paper-overlay {
            position: fixed; inset: 0; z-index: 100;
            background-color: rgba(59,77,90,.42);
            opacity: 0; pointer-events: none; transition: opacity .32s ease; will-change: opacity;
        }
        .paper-overlay.is-visible { opacity: 1; pointer-events: auto; }

        /* 兩個袋子共用紙堆：底紙斜放，上層紙張以抽走與蓋回切換。 */
        .stack {
            position: fixed; top: 50%; left: 50%; z-index: 101;
            width: var(--sheet-w); aspect-ratio: 3.2 / 4.2;
            opacity: 0; pointer-events: none;
            transform: translate3d(-50%, calc(-50% + 22px), 0) scale(.97);
            transition: transform .5s cubic-bezier(.2,.9,.3,1), opacity .35s ease;
            will-change: transform, opacity;
        }
        .stack.is-visible { opacity: 1; pointer-events: auto; transform: translate3d(-50%, -50%, 0) scale(1); }
        .stack-bot, .stack-mid { position: absolute; inset: 0; border-radius: 2px; border: 1px solid rgba(0,0,0,.03); }
        .stack-bot { z-index: 1; background: #e1ddd2; transform: rotate(-1.5deg) translate(-2px, 8px); box-shadow: 0 12px 30px rgba(0,0,0,.18), 0 4px 10px rgba(0,0,0,.08); }
        .stack-mid { z-index: 2; background: #ebe7de; transform: rotate(1deg) translate(3px, 4px); box-shadow: -2px 6px 15px rgba(0,0,0,.08); }
        .stack-vp {
            position: absolute; inset: 0; z-index: 3; overflow: visible; touch-action: pan-y;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        }
        .stack-track { position: absolute; inset: 0; isolation: isolate; }
        .stack .stack-track > * {
            position: absolute; inset: 0;
            transform: translate3d(0, 0, 0) rotate(0deg); transform-origin: 50% 85%;
            will-change: transform, opacity;
        }
        .stack .stack-track > :not(.stack-shadow) { isolation: isolate; box-shadow: none; }
        /* 陰影獨立於紙面，只改位置與透明度，不逐幀重畫模糊陰影。 */
        .stack .stack-track > .stack-shadow {
            border-radius: 2px; pointer-events: none; opacity: 0;
            box-shadow: 0 10px 26px rgba(0,0,0,.2);
        }
        .stack-vp input { -webkit-user-select: text; user-select: text; }

        /* 訂閱封面與 API 紙片共用的底色、陰影與紙紋。 */
        .cover, .api-sheet {
            position: relative; overflow: hidden; box-sizing: border-box;
            background: var(--sheet); border-radius: 2px;
            box-shadow: -1px 3px 10px rgba(0,0,0,.06);
        }
        .cover::before, .api-sheet::before {
            content: ''; position: absolute; inset: 0; z-index: 6; pointer-events: none;
            background: var(--paper-grain);
        }

        /* ================= 訂閱封面 ================= */
        .cover { display: flex; }

        /* 左側：封面圖上傳與顯影 */
        .cover-art {
            position: relative; width: 56%; height: 100%; flex-shrink: 0; overflow: hidden; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            background-color: #a4b8c6;
            background-image: linear-gradient(rgba(255,255,255,.22) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.22) 1px, transparent 1px);
            background-size: 14px 14px;
        }
        .cover-art .uploaded-media {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
            transition: opacity .5s ease, filter .8s ease, transform .75s cubic-bezier(.2,.8,.3,1);
        }
        .cover-art .uploaded-media.developing { opacity: 0; filter: blur(8px) grayscale(1) brightness(1.2); transform: scale(1.04); }
        .cover-art.has-image::after { content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none; background: rgba(117,144,163,.22); mix-blend-mode: multiply; }
        .upload-icon { display: flex; flex-direction: column; align-items: center; line-height: 1; pointer-events: none; color: rgba(255,255,255,.6); font-size: 26px; font-weight: 300; }
        .upload-text { margin-top: 8px; font-size: 9px; letter-spacing: 2px; color: rgba(255,255,255,.55); }
        .loading-text { display: none; position: absolute; z-index: 2; font-size: 10px; letter-spacing: 1px; color: rgba(255,255,255,.75); }
        .cover-art-file { display: none; }
        .cover-count { position: absolute; left: 14px; bottom: 10px; z-index: 4; font-size: 8px; letter-spacing: 1.5px; color: rgba(255,255,255,.75); pointer-events: none; }

        /* 右側：訂閱名稱、帳號、模型與額度 */
        .cover-band { position: relative; flex: 1; height: 100%; overflow: hidden; background: var(--sheet); box-shadow: -6px 0 14px -10px rgba(59,77,90,.35); }
        .cover-giant {
            position: absolute; top: -6px; bottom: -6px; right: -14px; z-index: 1;
            writing-mode: vertical-rl; user-select: none; pointer-events: none;
            font-size: 118px; font-weight: 700; line-height: 1; letter-spacing: -2px; color: rgba(164,184,198,.34);
        }
        .cover-band-inner {
            position: relative; z-index: 2; height: 100%; box-sizing: border-box;
            padding: 0 16px 0 18px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .cover-title {
            align-self: flex-start; min-width: 76%; padding-bottom: 1px;
            font-size: 24px; font-weight: 600; letter-spacing: 1px; color: var(--ink);
            border-bottom: 1px solid var(--ink);
        }
        .cover-sub { margin-top: 5px; font-size: 9px; letter-spacing: 2px; color: var(--muted); }
        .cover-links { margin-top: 26px; display: flex; flex-direction: column; gap: 14px; }
        .cover-link { all: unset; position: relative; display: flex; flex-direction: column; gap: 3px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .cover-link-label { font-size: 8px; letter-spacing: 2.5px; font-weight: 500; color: var(--muted); }
        .cover-link-value { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .5px; color: var(--ink); transition: transform .2s ease; }
        .cover-link-value::after { content: '›'; font-size: 13px; color: rgba(59,77,90,.4); }
        .cover-link:active .cover-link-value { transform: translateX(3px); opacity: .7; }
        .cover-foot { position: absolute; left: 18px; right: 16px; bottom: 10px; z-index: 2; display: flex; justify-content: space-between; font-size: 8px; letter-spacing: 2px; color: var(--muted); }
        .cover-status { white-space: nowrap; }
        .cover-status.is-connected { color: var(--btn); }

        /* ================= API 紙片 ================= */
        .api-sheet { --accent: var(--env1); }
        .api-lines {
            position: absolute; top: 0; right: 20px; z-index: 1;
            width: 64px; height: 30%;
            background: repeating-linear-gradient(90deg, rgba(59,77,90,.42) 0 1px, transparent 1px 7px);
        }
        .api-block {
            position: absolute; top: 22%; right: 16px; z-index: 2;
            width: 38px; height: 30px; background-color: var(--accent);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 100%, 50% 50%, 0 50%);
            transition: background-color .4s ease;
        }
        .api-bar {
            position: absolute; top: 0; left: 26px; z-index: 2; width: 56px; height: 5px;
            background-color: var(--accent); transition: background-color .4s ease;
        }
        .api-hatch {
            position: absolute; top: 37%; right: 18px; z-index: 2; width: 34px; height: 7px;
            background: repeating-linear-gradient(-55deg, var(--ink) 0 1px, transparent 1px 5px);
            opacity: .55;
        }
        .api-side {
            position: absolute; left: 10px; top: 26px; z-index: 2;
            writing-mode: vertical-rl; font-size: 7.5px; letter-spacing: 2px; font-weight: 500; color: var(--muted);
        }
        .api-head { position: absolute; left: 26px; right: 92px; top: 26px; z-index: 2; }
        .api-giant { display: flex; align-items: baseline; gap: 4px; font-size: 58px; font-weight: 300; line-height: .9; letter-spacing: -1px; color: var(--ink); }
        .api-total { font-size: 11px; letter-spacing: 1px; color: var(--muted); }
        .api-plus { all: unset; cursor: pointer; font-size: inherit; font-weight: 300; line-height: inherit; color: var(--ink); padding-right: 6px; }
        .api-plus:active { opacity: .5; }
        .api-note-label { display: block; margin-top: 8px; font-size: 7.5px; letter-spacing: 1.5px; font-weight: 500; color: var(--muted); }
        .api-note {
            all: unset; display: block; box-sizing: border-box; width: 100%; padding: 2px 0 1px;
            font-family: "ZSFT-br", sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1px; color: var(--ink);
            border-bottom: 1px solid var(--ink);
        }
        .api-note:placeholder-shown { border-bottom-style: dashed; border-bottom-color: rgba(59,77,90,.45); }
        .api-note::placeholder { color: rgba(114,130,142,.6); font-weight: 400; }

        .api-rule {
            position: absolute; left: 26px; right: 20px; top: 50%; z-index: 2;
            display: flex; align-items: center; gap: 8px;
            font-size: 7.5px; letter-spacing: 1.5px; font-weight: 500; color: var(--muted);
        }
        .api-rule-line { flex: 1; height: 1px; background: rgba(59,77,90,.35); }
        .api-del { all: unset; cursor: pointer; font-size: 7.5px; letter-spacing: 1.5px; color: var(--muted); }
        .api-del:active { opacity: .6; }

        .api-form {
            position: absolute; left: 26px; right: 20px; bottom: 40px; z-index: 2;
            display: flex; flex-direction: column; gap: 11px;
        }
        .api-field { display: flex; flex-direction: column; gap: 2px; }
        .api-label { display: flex; align-items: baseline; gap: 6px; font-size: 7.5px; letter-spacing: 1.5px; font-weight: 500; color: var(--muted); }
        .api-label b { font-weight: 600; color: var(--ink); }
        .api-row { position: relative; display: flex; align-items: center; border-bottom: 1px solid rgba(59,77,90,.3); transition: border-color .2s ease; }
        .api-row:focus-within { border-color: var(--ink); }
        .api-input {
            all: unset; flex: 1; min-width: 0; padding: 3px 0 2px;
            font-family: "ZSFT-br", sans-serif; font-size: 12px; color: var(--ink);
        }
        .api-input::placeholder { color: rgba(114,130,142,.55); }
        .api-mini { all: unset; flex-shrink: 0; cursor: pointer; padding: 2px 0 2px 8px; font-size: 7.5px; letter-spacing: 1.5px; color: var(--muted); }
        .api-mini:active { opacity: .6; }
        .api-pick { all: unset; flex: 1; cursor: pointer; padding: 3px 0 2px; font-size: 12px; color: var(--ink); display: flex; justify-content: space-between; }
        .api-pick::after { content: '›'; font-size: 13px; color: rgba(59,77,90,.4); }
        .api-pick.is-empty { color: rgba(114,130,142,.55); }
        .api-pick:active { opacity: .6; }

        .api-foot {
            position: absolute; left: 26px; right: 20px; bottom: 12px; z-index: 2;
            display: flex; align-items: baseline; justify-content: space-between;
            font-size: 8px; letter-spacing: 1.5px; color: var(--muted);
        }
        .api-status.is-on { color: var(--btn); font-weight: 600; }
        .api-actions { display: flex; gap: 14px; }
        .api-act { all: unset; cursor: pointer; font-size: 8.5px; letter-spacing: 1.5px; font-weight: 500; color: var(--ink); }
        .api-act.is-primary { padding-bottom: 1px; border-bottom: 1px solid var(--ink); }
        .api-act:active { opacity: .6; }

        /* ================= 吊牌（小房子） ================= */
        .tag-overlay {
            position: fixed; inset: 0; z-index: 115;
            background: rgba(40,55,66,.32);
            opacity: 0; pointer-events: none; transition: opacity .3s ease; will-change: opacity;
        }
        .tag-overlay.is-visible { opacity: 1; pointer-events: auto; }
        .hang-tag {
            --tag-string: 30svh;
            position: fixed; top: 0; left: 50%; z-index: 120;
            width: 188px; margin-left: -94px;
            opacity: 0; visibility: hidden; pointer-events: none;
            transform: translateY(-24px);
            transition: opacity .3s ease, transform .45s cubic-bezier(.2,.8,.2,1), visibility 0s linear .45s;
            filter: drop-shadow(0 22px 22px rgba(20,30,40,.38)) drop-shadow(0 4px 6px rgba(20,30,40,.22));
        }
        .hang-tag.is-visible {
            opacity: 1; visibility: visible; pointer-events: auto; transform: none;
            transition: opacity .3s ease, transform .45s cubic-bezier(.2,.8,.2,1), visibility 0s;
        }
        .tag-string { position: relative; z-index: 3; width: 1.5px; height: var(--tag-string); margin: 0 auto -16px; background: #d6d0c3; }
        .tag-card { position: relative; width: 188px; }

        /* 上半部：屋頂、標題與操作文字 */
        .tag-roof { display: block; width: 188px; height: 150px; }
        .tag-roof text { font-family: "ZSFT-br", sans-serif; }
        .tag-roof #tagTitle.is-action { cursor: pointer; fill: rgba(241,239,233,.9); font-weight: 600; transform: translateY(2px); }
        .tag-roof #tagTitle.is-action:active { opacity: .6; }

        /* 下半部：固定高度的選項列表，可垂直捲動。 */
        .tag-walls {
            position: relative; z-index: 1;
            margin: -6px 8px 0; height: 81px; box-sizing: border-box; padding: 5px 14px 10px;
            display: flex; flex-direction: column;
            background: var(--sheet); border-radius: 0 0 10px 10px;
        }
        .tag-walls::before {
            content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.07"/></svg>');
            mix-blend-mode: multiply;
        }
        .tag-kicker { font-size: 7.5px; letter-spacing: 1.5px; font-weight: 500; color: var(--muted); }
        .tag-list {
            flex: 1; min-height: 0; margin-top: 3px; padding-top: 3px;
            display: flex; flex-direction: column;
            border-top: 1px solid rgba(59,77,90,.4);
            overflow-y: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .tag-list::-webkit-scrollbar { display: none; }
        .tag-list.is-overflow { -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
        .tag-option {
            all: unset; flex-shrink: 0; cursor: pointer;
            display: flex; align-items: center; gap: 5px; padding: 1.5px 0;
            font-size: 11px; line-height: 1.25; color: #5b6a75;
            word-break: break-all; -webkit-tap-highlight-color: transparent;
        }
        .tag-option::before { content: ''; flex-shrink: 0; width: 4px; height: 4px; border-radius: 50%; border: 1px solid rgba(59,77,90,.45); }
        .tag-option.is-selected { color: var(--ink); font-weight: 600; }
        .tag-option.is-selected::before { background: var(--ink); border-color: var(--ink); }
        .tag-option.is-static { cursor: default; }
        .tag-option:not(.is-static):active { opacity: .6; }

        /* ================= 提示：拼貼紙條 =================
           一條細長的米白撕紙，底下錯開墊一塊淺灰藍紙，左端斜貼一截紙膠帶，結果寫在紙上。
           成功／提醒：停一會兒自己收回。失敗：原因直接寫在標題下面，停久一點，點一下也能收走。 */
        .mail {
            position: fixed; z-index: 210; left: 50%;
            top: calc(14px + env(safe-area-inset-top));
            width: min(420px, calc(100vw - 34px));
            transform: translate3d(-50%, -220%, 0) rotate(-.7deg);
            transition: transform .5s cubic-bezier(.22,.8,.3,1);
            font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .mail.is-in { transform: translate3d(-50%, 0, 0) rotate(-.7deg); }

        /* 撕邊都用遮罩切，陰影放在外層 drop-shadow 才不會被切掉 */
        .mail-strip-wrap { position: relative; filter: drop-shadow(0 2px 4px rgba(59,77,90,.14)) drop-shadow(0 0 1px rgba(59,77,90,.12)); }

        /* 排版參考海報：背後一個超大淡色英文字，左邊兩行小號大寫標籤，中間粗黑標題，右邊斜體細字的日期時間 */
        .mail-mark {
            position: absolute; right: 14px; top: 50%; transform: translateY(-52%);
            font-size: 44px; line-height: 1; font-weight: 700; letter-spacing: 2px;
            color: rgba(107,131,150,.07); pointer-events: none; white-space: nowrap;
        }
        .mail.is-fail .mail-mark { top: 14px; transform: none; font-size: 40px; color: rgba(160,145,111,.1); }
        .mail-row { position: relative; display: flex; align-items: center; gap: 12px; white-space: nowrap; min-width: 0; }
        .mail-kicker {
            flex-shrink: 0; display: flex; flex-direction: column; gap: 2px;
            padding-right: 12px; border-right: 1px solid rgba(59,77,90,.18);
            font-size: 6.5px; line-height: 1; letter-spacing: 1.6px; color: var(--muted);
        }
        .mail-kicker b { font-size: 7.5px; letter-spacing: 2px; font-weight: 700; color: var(--ink); }
        .mail.is-fail .mail-kicker b { color: #8f805f; }
        .mail-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; letter-spacing: 2px; font-weight: 700; color: var(--ink); }
        /* 窄螢幕：收掉日期，只留時間，標題字距收一點，保證一行放得下（標題都控制在六個字以內） */
        @media (max-width: 380px) {
            .mail-title { font-size: 14px; letter-spacing: 1.2px; }
            .mail-time small { display: none; }
            .mail-row { gap: 10px; }
            .mail-kicker { padding-right: 10px; }
        }
        .mail-time {
            flex-shrink: 0; margin-left: auto; display: flex; align-items: baseline; gap: 5px;
            font-size: 11px; font-style: italic; font-weight: 300; letter-spacing: .5px; color: var(--muted);
        }
        .mail-time small { font-size: 6.5px; font-style: normal; font-weight: 500; letter-spacing: 1.2px; line-height: 1.1; }
        .mail-reason {
            display: none; position: relative; margin-top: 4px; padding-left: 16px;
            font-size: 11.5px; line-height: 1.65; letter-spacing: .5px; color: var(--muted); word-break: break-word;
        }
        .mail-reason::before { content: '→'; position: absolute; left: 0; top: 0; color: #a0916f; }
        .mail.is-fail .mail-reason { display: block; }
        .mail.is-fail .mail-strip { gap: 8px; }

        /* 紙膠帶：斜斜貼在左端，兩頭撕開 */
        .mail-tape {
            position: absolute; z-index: 3; pointer-events: none;
            left: -12px; top: -1px; width: 54px; height: 17px;
            background-color: #9fb1bf;
            background-image: repeating-linear-gradient(70deg, transparent 0 6px, #b7c6d1 6px 7px);

</head>
<body>

    <!-- 左上角小魚返回鍵 -->

    <!-- 提示紙條 -->
    <div class="mail" id="mail" role="status" aria-live="polite">

    </div>

    <script>
        /* ===== 預留接口：以下為預覽資料，接入時覆蓋 window 上的同名函數。 =====

           【訂閱】每個函數第一個參數 p 是訂閱名：'codex' | 'gemini' | 'kimi'
           subStatus(p)            首次開啟或翻到這張時讀取，resolve { loggedIn, account, plan, model }
           subLogin(p)             點 ACCOUNT（未登入時）：跳到對應的登入頁，登入完成 resolve { account, plan }
           subLogout(p)            ACCOUNT 吊牌上的 LOGOUT，resolve
           subModels(p)            點 MODEL 讀可用模型，resolve ['模型名', ...]
           saveSubConfig(p, cfg)   選好模型後保存，cfg = { model }
           subQuota(p)             點 QUOTA 刷新剩餘額度，resolve { left, resetAt }，left 是 0–100

           【API】一張紙 = 一個預設 { id, note, endpoint, key, model }，note 是用戶自己填的備註
           apiPresets()            打開時讀一次，resolve { presets: [...], activeId }
           saveApiPreset(p)        點 SAVE；新紙沒有 id，由後端生成，resolve 存好的預設（帶 id）
           deleteApiPreset(id)     點 DELETE，resolve
           useApiPreset(id)        點 USE，把這張設成正在用的，resolve
           apiModels(cfg)          點 MODEL：用這張紙上填的 endpoint + key 拉模型列表，resolve ['模型名', ...]
           apiTest(cfg)            點 TEST：試連一次，resolve 表示成功，reject 表示失敗

           封面圖只存在瀏覽器（IndexedDB），不用接後端。 */
        const DEMO_MODELS = { codex: ['gpt-5.6-sol', 'gpt-5.6', 'gpt-5.6-mini'], gemini: ['gemini-3-pro', 'gemini-3-flash'], kimi: ['kimi-k3', 'kimi-k3-turbo'] };
        window.subStatus = window.subStatus || (() => Promise.resolve({ loggedIn: false, account: '', plan: '', model: '' }));
        window.subLogin = window.subLogin || (() => new Promise(r => setTimeout(() => r({ account: 'yuyu@example.com', plan: 'plus' }), 900)));
        window.subLogout = window.subLogout || (() => new Promise(r => setTimeout(r, 400)));
        window.subModels = window.subModels || (p => Promise.resolve(DEMO_MODELS[p] || []));
        window.saveSubConfig = window.saveSubConfig || (() => new Promise(r => setTimeout(r, 300)));
        window.subQuota = window.subQuota || (() => new Promise(r => setTimeout(() => r({ left: 96, resetAt: '11月20日 01:59' }), 600)));

        window.apiPresets = window.apiPresets || (() => Promise.resolve({
            presets: [
                { id: 'p1', note: '', endpoint: 'https://api.deepseek.com', key: 'sk-demo1', model: 'deepseek-chat' },
                { id: 'p2', note: '', endpoint: 'https://api.example.com/v1', key: 'sk-demo2', model: 'some-model' }
            ],
            activeId: 'p1'
        }));
        window.saveApiPreset = window.saveApiPreset || (p => new Promise(r => setTimeout(() => r(Object.assign({}, p, { id: p.id || 'p' + Date.now() })), 300)));
        window.deleteApiPreset = window.deleteApiPreset || (() => new Promise(r => setTimeout(r, 300)));
        window.useApiPreset = window.useApiPreset || (() => new Promise(r => setTimeout(r, 300)));
        window.apiModels = window.apiModels || (() => new Promise(r => setTimeout(() => r(['deepseek-chat', 'deepseek-reasoner']), 500)));
        window.apiTest = window.apiTest || (() => new Promise(r => setTimeout(r, 600)));

        /* ===== 工具函數 ===== */
        const $ = id => document.getElementById(id);
        const pad2 = n => String(n).padStart(2, '0');
        const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        /* ===== 提示紙條 =====
           notify.ok('已保存')                成功：停 1.8 秒自己收回
           notify.note('先填網址金鑰') 提醒：停 2.2 秒自己收回
           notify.fail('保存失敗', err)        失敗：原因寫在標題下面，停 5 秒；點一下紙條都能提前收走
           原因取自 reject 帶回來的 Error.message（或字串）；接口 reject 時請帶上一句人看得懂的原因。 */
        const mail = $('mail');
        let mailTimer = null, mailBusy = null;

        function mailHide() {
            clearTimeout(mailTimer);
            mail.classList.remove('is-in');
        }
        function mailShow(kind, title, reason) {
            clearTimeout(mailTimer); clearTimeout(mailBusy);
            const replace = mail.classList.contains('is-in');
            if (replace) mail.classList.remove('is-in');
            mailBusy = setTimeout(() => {
                mail.classList.remove('is-ok', 'is-note', 'is-fail');
                mail.classList.add('is-' + kind);
                $('mailKicker').textContent = kind === 'fail' ? '未成功' : kind === 'note' ? 'NOTE' : 'DONE';
                $('mailMark').textContent = kind === 'fail' ? 'RETRY' : kind === 'note' ? 'NOTE' : 'DONE';
                const now = new Date(), pad = n => String(n).padStart(2, '0');
                $('mailDate').textContent = pad(now.getMonth() + 1) + '.' + pad(now.getDate());
                $('mailTime').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
                $('mailTitle').textContent = title;
                $('mailReason').textContent = reason || '';
                requestAnimationFrame(() => requestAnimationFrame(() => mail.classList.add('is-in')));
                mailTimer = setTimeout(mailHide, kind === 'fail' ? 5000 : kind === 'note' ? 2200 : 1800);
            }, replace ? 280 : 0);
        }
        mail.addEventListener('click', mailHide);

        const reasonOf = err => (err && (err.message || (typeof err === 'string' ? err : ''))) || '沒有收到具體原因，可以稍後再試一次。';
        const notify = {
            ok: t => mailShow('ok', t),
            note: t => mailShow('note', t),
            fail: (t, err) => mailShow('fail', t, reasonOf(err))
        };

        /* 換字時先模糊淡出，再淡入新字；動畫結束後不保留樣式。 */
        function setText(el, text) {
            el._target = text;
            if (el._busy) return;
            if (el.textContent === text) return;
            el._busy = true;
            el.getAnimations().forEach(a => a.cancel());
            const out = el.animate([{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(1.25px)' }], { duration: 140, easing: 'ease-out', fill: 'forwards' });
            const done = () => {
                el._busy = false;
                if (el.textContent !== el._target) setText(el, el._target);
            };
            out.finished.then(() => {
                el.textContent = el._target;
                out.cancel();
                const inn = el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: 'ease-out' });
                return inn.finished;
            }).then(done, () => { el.textContent = el._target; done(); });
        }

        /* 彈層開啟時固定檔案袋縮放，避免鍵盤改變視窗高度時跟著縮小。 */
        function freezeScale() {
            document.documentElement.style.setProperty('--scale', getComputedStyle(document.documentElement).getPropertyValue('--scale').trim());
        }
        function unfreezeScale() { document.documentElement.style.removeProperty('--scale'); }

        /* ===== 檔案袋：滑鼠點擊與鍵盤選取 ===== */
        const envelopes = document.querySelectorAll('.envelope');
        function selectEnvelope(env) {
            envelopes.forEach(e => { e.classList.toggle('is-active', e === env); e.setAttribute('aria-pressed', e === env); });
        }
        envelopes.forEach(env => {
            env.addEventListener('click', () => selectEnvelope(env));
            env.addEventListener('keydown', e => {
                if (e.key !== 'Enter' && e.key !== ' ') return;
                e.preventDefault();
                selectEnvelope(env);
            });
        });

        /* ===== 紙堆：左滑抽走目前紙張，右滑將上一張蓋回 ===== */
        function makeStack(track, onChange) {
            /* 紙張層級按頁序固定；只顯示目前頁與下一頁，抽走的紙保持隱藏。 */
            const vp = track.parentNode;
            const st = { index: 0, dragged: false, busy: false };
            const shade = document.createElement('div');
            shade.className = 'stack-shadow';
            shade.setAttribute('aria-hidden', 'true');
            const pages = () => Array.from(track.children).filter(p => p !== shade);
            const EASE = 'cubic-bezier(.25,.8,.3,1)';
            const DUR = 620;
            const soft = (d, w) => { const cap = w * 0.85; return Math.sign(d) * cap * (1 - Math.exp(-Math.abs(d) / cap)); };
            let w = 0, off = 0, motion = null;
            let sx = 0, sy = 0, cx = 0, t0 = 0, dragging = false, pid = null;
            /* 拖動時微微旋轉並帶陰影；抽出末段淡出，上一張隨右拖淡入。 */
            const transform = x => `translate3d(${x}px, ${-x * 0.012}px, 0) rotate(${x * 0.01}deg)`;
            function shadow(paper, strength) {
                shade.style.zIndex = Number(paper.style.zIndex) - 1;
                shade.style.transform = paper.style.transform;
                shade.style.opacity = strength * Number(paper.style.opacity);
            }

            function rest() {
                w = vp.clientWidth;
                off = (window.innerWidth + w) / 2 + vp.clientHeight * 0.2 + 40;
                const list = pages();
                list.forEach((p, i) => {
                    p.style.zIndex = (list.length - i) * 2;
                    p.style.visibility = i === st.index || i === st.index + 1 ? 'visible' : 'hidden';
                    p.style.opacity = i < st.index ? 0 : 1;
                    p.style.transform = transform(i < st.index ? -off : 0);
                    p.inert = i !== st.index;
                });
                shade.style.opacity = 0;
            }
            st.update = () => {
                track.appendChild(shade);
                rest();
                if (motion) {
                    motion.animation.onfinish = null;
                    motion.animation.cancel();
                    motion.shadowAnimation.cancel();
                    motion = null;
                }
                dragging = false;
                st.busy = false;
                onChange && onChange(st.index);
            };
            st.current = () => pages()[st.index];

            function paint(d) {
                const list = pages(), cur = list[st.index], prev = list[st.index - 1];
                const pulling = d < 0 && st.index < list.length - 1;
                const k = pulling ? Math.min(1, -d / w) : 0;
                cur.style.transform = transform(pulling ? d : 0);
                cur.style.opacity = k > 0.85 ? Math.max(0, 1 - (k - 0.85) / 0.15) : 1;
                if (prev) {
                    /* 右拖時，上一張從紙堆左側淡入，隨手勢蓋回。 */
                    const kp = Math.min(1, Math.max(0, d) / w);
                    prev.style.transform = transform(-(w + 40) * (1 - kp));
                    prev.style.opacity = Math.min(1, kp * 3);
                    prev.style.visibility = kp > 0 ? 'visible' : 'hidden';
                    if (d > 0) { shadow(prev, 1 - kp); return; }
                }
                shadow(cur, k);
            }

            function finish() {
                if (!motion) return;
                const changed = st.index !== motion.index;
                st.index = motion.index;
                motion.animation.onfinish = null;
                /* 先寫入落定狀態，再取消動畫；淡出的紙不會重新變成不透明。 */
                rest();
                motion.animation.cancel();
                motion.shadowAnimation.cancel();
                motion = null;
                st.busy = false;
                if (changed && onChange) onChange(st.index);
            }

            /* 回彈與翻頁共用動畫，先設定終點樣式，再銜接拖曳位置。 */
            function settle(i, d) {
                const list = pages();
                const returning = d > 0 && st.index > 0;
                const paper = list[returning ? st.index - 1 : st.index];
                const from = { transform: paper.style.transform, opacity: paper.style.opacity || 1 };
                const shadowFrom = { transform: from.transform, opacity: shade.style.opacity };
                const toX = returning ? (i < st.index ? 0 : -off) : (i > st.index ? -off : 0);
                const out = toX !== 0;   /* 移至螢幕外 */
                /* 保留可見範圍內的淡出；結束後先隱藏，再移到螢幕外。 */
                const visX = out ? (returning ? -(w + 40) : -w * 1.08) : 0;
                const to = { transform: transform(visX), opacity: out ? 0 : 1 };
                const shadowTo = { transform: to.transform, opacity: 0 };
                paper.style.visibility = 'visible';
                paper.style.transform = to.transform;
                paper.style.opacity = to.opacity;
                shade.style.zIndex = Number(paper.style.zIndex) - 1;
                shade.style.transform = shadowTo.transform;
                shade.style.opacity = shadowTo.opacity;
                st.busy = true;
                /* 抽出時延後淡出；蓋回時提早恢復不透明。 */
                const frames = out
                    ? [from, { opacity: from.opacity, offset: 0.4 }, to]
                    : [from, { opacity: 1, offset: 0.3 }, to];
                /* 蓋回時使用較長時間與較緩的緩動。 */
                const timing = out
                    ? { duration: DUR, easing: EASE, fill: 'both' }
                    : { duration: DUR + 120, easing: 'cubic-bezier(.22,.65,.2,1)', fill: 'both' };
                const animation = paper.animate(frames, timing);
                const shadowAnimation = shade.animate(out
                    ? [shadowFrom, { opacity: from.opacity, offset: 0.4 }, shadowTo]
                    : [shadowFrom, shadowTo], timing);
                animation.startTime = shadowAnimation.startTime = document.timeline.currentTime;
                motion = { animation, shadowAnimation, index: i };
                animation.onfinish = finish;
            }
            st.goTo = i => {
                i = Math.max(0, Math.min(i, pages().length - 1));
                finish();
                if (i === st.index) return;
                if (Math.abs(i - st.index) === 1) { settle(i, i < st.index ? 1 : -1); return; }
                st.index = i; st.update();
            };

            vp.addEventListener('pointerdown', e => {
                if (!e.isPrimary || e.button > 0) return;
                st.dragged = false;
                if (e.target.closest('input')) return;
                finish();
                rest();
                sy = e.clientY;
                sx = cx = e.clientX; t0 = performance.now(); dragging = true; pid = e.pointerId;
            });
            vp.addEventListener('pointermove', e => {
                if (!dragging || e.pointerId !== pid) return;
                cx = e.clientX;
                if (!st.dragged) {
                    const dx = Math.abs(cx - sx), dy = Math.abs(e.clientY - sy);
                    if (dy > 6 && dy > dx) { dragging = false; return; }
                    if (dx <= 6) return;
                    st.dragged = true;
                    vp.setPointerCapture(pid);
                }
                paint(soft(cx - sx, w));
            });
            const end = e => {
                if (!dragging || e.pointerId !== pid) return;
                dragging = false;
                if (vp.hasPointerCapture(pid)) vp.releasePointerCapture(pid);
                if (!st.dragged) return;
                const d = soft(cx - sx, w);
                const fast = Math.abs(cx - sx) / Math.max(1, performance.now() - t0) > 0.5;
                let i = st.index;
                if (e.type !== 'pointercancel') {
                    if ((d < -w * 0.22 || (fast && d < -30)) && i < pages().length - 1) i++;
                    else if ((d > w * 0.22 || (fast && d > 30)) && i > 0) i--;
                }
                settle(i, d);
            };
            vp.addEventListener('pointerup', end);
            vp.addEventListener('pointercancel', end);
            /* Safari 的原生文字／圖片拖曳不能接管紙張手勢。 */
            vp.addEventListener('dragstart', e => { if (!e.target.closest('input')) e.preventDefault(); });
            /* 攔下拖曳結束後的點擊；下次按下時重設 dragged。 */
            vp.addEventListener('click', e => { if (st.dragged && e.detail !== 0) { e.stopPropagation(); e.preventDefault(); } }, true);
            return st;
        }

        /* 紙堆開關、共用遮罩與方向鍵切換 */
        const paperOverlay = $('paperOverlay');
        const subStackEl = $('subStack');
        const apiStackEl = $('apiStack');
        let openStackEl = null;
        let activeSheet = null;

        function openStack(el) {
            freezeScale();
            document.body.style.overflow = 'hidden';
            paperOverlay.classList.add('is-visible');
            el.classList.add('is-visible');
            openStackEl = el;
        }
        function closeAll() {
            closeTag();
            document.activeElement && document.activeElement.blur();
            document.body.style.overflow = '';
            paperOverlay.classList.remove('is-visible');
            subStackEl.classList.remove('is-visible');
            apiStackEl.classList.remove('is-visible');
            openStackEl = null;
            unfreezeScale();
        }
        paperOverlay.addEventListener('click', closeAll);
        document.addEventListener('keydown', e => {
            if (!openStackEl || e.target.tagName === 'INPUT') return;
            const st = openStackEl === subStackEl ? subStack : apiStack;
            if (e.key === 'ArrowRight') st.goTo(st.index + 1);
            if (e.key === 'ArrowLeft') st.goTo(st.index - 1);
            if (e.key === 'Escape') closeAll();
        });

        /* ===== 訂閱：Codex / Gemini / Kimi 封面與狀態 ===== */
        const PROVIDERS = [
            { id: 'codex', name: 'Codex', giant: 'CODEX', art: '#a4b8c6', size: 96 },
            { id: 'gemini', name: 'Gemini', giant: 'GEMINI', art: '#9cadba', size: 96 },
            { id: 'kimi', name: 'Kimi', giant: 'KIMI', art: '#adbac2', size: 96 }
        ];
        const subState = {};
        PROVIDERS.forEach(p => { subState[p.id] = { loggedIn: false, account: '', plan: '', model: '', quota: null, loaded: false }; });

        const subTrack = $('subTrack');
        subTrack.innerHTML = PROVIDERS.map((p, i) => `
            <div class="cover" data-p="${p.id}">
                <div class="cover-art js-art" style="background-color:${p.art}">
                    <span class="upload-icon js-icon">+<span class="upload-text">點擊上傳</span></span>
                    <div class="loading-text js-loading">載入中...</div>
                    <input class="cover-art-file js-file" type="file" accept="image/*">
                    <span class="cover-count">${pad2(i + 1)} / ${pad2(PROVIDERS.length)}</span>
                </div>
                <div class="cover-band">
                    <div class="cover-giant" style="font-size:${p.size}px">${p.giant}</div>
                    <div class="cover-band-inner">
                        <div class="cover-title">${p.name}</div>
                        <div class="cover-sub">訂閱連接</div>
                        <div class="cover-links">
                            <button class="cover-link js-account" type="button"><span class="cover-link-label">ACCOUNT</span><span class="cover-link-value js-account-v">未登入</span></button>
                            <button class="cover-link js-model" type="button"><span class="cover-link-label">MODEL</span><span class="cover-link-value js-model-v">未設定</span></button>
                            <button class="cover-link js-quota" type="button"><span class="cover-link-label">QUOTA</span><span class="cover-link-value js-quota-v">—</span></button>
                        </div>
                    </div>
                    <div class="cover-foot">
                        <span class="cover-status js-status">NOT CONNECTED</span>
                    </div>
                </div>
            </div>`).join('');

        const coverOf = id => subTrack.querySelector(`.cover[data-p="${id}"]`);

        function renderSub(id) {
            const s = subState[id], c = coverOf(id);
            setText(c.querySelector('.js-account-v'), s.loggedIn ? (s.plan || 'SIGNED IN').toUpperCase() : '未登入');
            setText(c.querySelector('.js-model-v'), s.model || '未設定');
            setText(c.querySelector('.js-quota-v'), s.quota ? `剩餘 ${s.quota.left}%` : '—');
            const status = c.querySelector('.js-status');
            setText(status, s.loggedIn ? 'CONNECTED' : 'NOT CONNECTED');
            status.classList.toggle('is-connected', s.loggedIn);
        }
        function loadQuota(id) {
            setText(coverOf(id).querySelector('.js-quota-v'), '讀取中…');
            return window.subQuota(id)
                .then(q => { subState[id].quota = q; renderSub(id); })
                .catch(err => { renderSub(id); notify.fail('額度讀取失敗', err); });
        }
        function loadSub(id) {
            if (subState[id].loaded) return;
            subState[id].loaded = true;
            window.subStatus(id).then(s => {
                Object.assign(subState[id], s);
                renderSub(id);
                if (subState[id].loggedIn) loadQuota(id);
            }).catch(() => { subState[id].loaded = false; });
        }

        const subStack = makeStack(subTrack, i => {
            activeSheet = subStack && subStack.current();
            if (subStackEl.classList.contains('is-visible')) loadSub(PROVIDERS[i].id);
        });
        subStack.update();

        $('codexTie').addEventListener('click', e => {
            e.stopPropagation();
            openStack(subStackEl);
            activeSheet = subStack.current();
            loadSub(PROVIDERS[subStack.index].id);
        });

        subTrack.addEventListener('click', e => {
            const c = e.target.closest('.cover');
            if (!c) return;
            const id = c.dataset.p, s = subState[id];
            activeSheet = c;

            if (e.target.closest('.js-art')) { if (!e.target.closest('.js-file')) c.querySelector('.js-file').click(); return; }

            if (e.target.closest('.js-account')) {
                if (!s.loggedIn) {
                    window.subLogin(id)
                        .then(r => { Object.assign(s, { loggedIn: true, account: r.account, plan: r.plan }); renderSub(id); notify.ok('已登入'); return loadQuota(id); })
                        .catch(err => notify.fail('登入失敗', err));
                    return;
                }
                openTag({
                    giant: 'ACCOUNT', giantY: 121, titleY: 135,
                    kicker: 'SIGNED IN',
                    title: 'LOGOUT',
                    titleAction: () => window.subLogout(id)
                        .then(() => { Object.assign(s, { loggedIn: false, account: '', plan: '', quota: null }); renderSub(id); notify.ok('已登出'); })
                        .catch(err => notify.fail('登出失敗', err)),
                    items: [{ label: s.account, static: true, selected: true }]
                });
            }
            else if (e.target.closest('.js-model')) {
                window.subModels(id).then(list => openTag({
                    giant: 'MODEL', kicker: 'SELECT', title: '模型',
                    items: list.map(m => ({ label: m, value: m, selected: m === s.model })),
                    onPick: m => window.saveSubConfig(id, { model: m })
                        .then(() => { s.model = m; renderSub(id); notify.ok('已保存'); })
                        .catch(err => notify.fail('保存失敗', err))
                }));
            }
            else if (e.target.closest('.js-quota')) {
                if (!s.loggedIn) { notify.note('請先登入'); return; }
                loadQuota(id);
            }

        /* ===== API：預設紙片、編輯與連接操作 ===== */
        const apiTrack = $('apiTrack');
        let presets = [];
        let activeId = null;
        const blankPreset = () => ({ id: '', note: '', endpoint: '', key: '', model: '' });

        function statusOf(p) {
            if (!p.id) return { text: 'NEW', on: false };
            return p.id === activeId ? { text: 'IN USE', on: true } : { text: 'STANDBY', on: false };
        }

        /* 正式紙張由深至淺線性插值；只有一張時使用最深色。 */
        function apiAccent(i, count) {
            const t = count === 1 ? 0 : i / (count - 1);
            return `rgb(${Math.round(81 + 83 * t)}, ${Math.round(101 + 83 * t)}, ${Math.round(117 + 81 * t)})`;
        }

        function sheetHTML(p, i, total) {
            const isNew = !p.id;
            const isPlus = !!p.plus;
            const st = statusOf(p);
            return `
            <div class="api-sheet" data-i="${i}" style="--accent:${isPlus ? '#b8c3ca' : apiAccent(i, total - 1)}">
                <div class="api-lines"></div>
                <div class="api-block"></div>
                <div class="api-bar"></div>
                <div class="api-hatch"></div>
                <div class="api-side">REMOTE CONNECT</div>
                <div class="api-head">
                    <div class="api-giant">${isPlus ? '<button class="api-plus js-add" type="button" aria-label="新增一張紙">+</button>' : pad2(i + 1)}<span class="api-total">/ ${pad2(total)}</span></div>
                    <label class="api-note-label">NOTE 備註</label>
                    <input class="api-note js-note" type="text" maxlength="16" autocomplete="off" placeholder="${isNew ? '新紙，寫個備註' : '寫個備註，好分清楚'}" value="${esc(p.note)}">
                </div>
                <div class="api-rule">
                    <span>A QUIET LINE</span><span class="api-rule-line"></span>
                    ${isPlus ? '' : '<button class="api-del js-del" type="button">DELETE</button>'}
                </div>
                <div class="api-form">
                    <label class="api-field">
                        <span class="api-label"><b>01</b>ENDPOINT</span>
                        <span class="api-row"><input class="api-input js-endpoint" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://api.deepseek.com" value="${esc(p.endpoint)}"></span>
                    </label>
                    <label class="api-field">
                        <span class="api-label"><b>02</b>KEY</span>
                        <span class="api-row">
                            <input class="api-input js-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-" value="${esc(p.key)}">
                            <button class="api-mini js-toggle" type="button">SHOW</button>
                        </span>
                    </label>
                    <div class="api-field">
                        <span class="api-label"><b>03</b>MODEL</span>
                        <span class="api-row"><button class="api-pick js-model${p.model ? '' : ' is-empty'}" type="button" data-model="${esc(p.model)}">${p.model ? esc(p.model) : '點擊讀取'}</button></span>
                    </div>
                </div>
                <div class="api-foot">
                    <span class="api-status js-status${st.on ? ' is-on' : ''}">${st.text}</span>
                    <span class="api-actions">
                        <button class="api-act js-test" type="button">TEST</button>
                        ${isNew ? '' : '<button class="api-act js-use" type="button">USE</button>'}
                        <button class="api-act is-primary js-save" type="button">SAVE</button>
                    </span>
                </div>
            </div>`;
        }

        /* 預設包含未保存的新紙；最後附加一張可新增的「+」紙。 */
        function renderApi(focus) {
            /* 以 id 或草稿物件對應紙張，記下重建前實際顯示的顏色。 */
            const previous = Array.from(apiTrack.querySelectorAll('.api-sheet'), sheet => ({
                preset: sheet._accentPreset,
                index: +sheet.dataset.i,
                color: getComputedStyle(sheet.querySelector('.api-block')).backgroundColor
            }));
            const colors = new Map(previous.map(({ preset, color }) => [preset.id || preset, color]));
            const draftColors = new Map(previous.filter(({ preset }) => !preset.id).map(({ index, color }) => [index, color]));

            const list = presets.concat([Object.assign(blankPreset(), { plus: true })]);
            apiTrack.innerHTML = list.map((p, i) => sheetHTML(p, i, list.length)).join('');
            const accents = Array.from(apiTrack.querySelectorAll('.api-sheet'), (sheet, i) => {
                const p = list[i];
                const color = sheet.style.getPropertyValue('--accent');
                sheet._accentPreset = p;
                if (!p.plus) {
                    const key = p.id || p;
                    if (colors.has(key)) {
                        sheet.style.setProperty('--accent', colors.get(key));
                    } else if (i === focus && draftColors.has(i)) {
                        /* 草稿取得 id，或「+」紙轉成新紙時，銜接原紙張的顏色。 */
                        sheet.style.setProperty('--accent', draftColors.get(i));
                    }
                }
                return { sheet, color };
            });
            apiStack.index = Math.max(0, Math.min(focus, list.length - 1));
            apiStack.update();

            /* 先建立舊色樣式，下一幀再切換目標色，交由兩個色塊的 transition 過渡。 */
            void apiTrack.offsetWidth;
            requestAnimationFrame(() => {
                accents.forEach(({ sheet, color }) => sheet.style.setProperty('--accent', color));
            });
        }

        function formOf(sheet) {
            const i = +sheet.dataset.i;
            return {
                id: (presets[i] && presets[i].id) || '',
                note: sheet.querySelector('.js-note').value.trim(),
                endpoint: sheet.querySelector('.js-endpoint').value.trim(),
                key: sheet.querySelector('.js-key').value.trim(),
                model: sheet.querySelector('.js-model').dataset.model || ''
            };
        }
        /* 重繪前保留尚未取得 id 的新紙內容。 */
        function keepDrafts() {
            apiTrack.querySelectorAll('.api-sheet').forEach(sheet => {
                const k = +sheet.dataset.i, p = presets[k];
                if (!p) return;
                const f = formOf(sheet);
                if (!p.id) Object.assign(p, { note: f.note, endpoint: f.endpoint, key: f.key, model: f.model });
            });
        }
        function setModel(sheet, m) {
            const pick = sheet.querySelector('.js-model');
            pick.dataset.model = m;
            setText(pick, m || '點擊讀取');
            pick.classList.toggle('is-empty', !m);
        }
        function refreshStatuses() {
            apiTrack.querySelectorAll('.api-sheet').forEach(sheet => {
                const st = statusOf(presets[+sheet.dataset.i] || {});
                const el = sheet.querySelector('.js-status');
                setText(el, st.text);
                el.classList.toggle('is-on', st.on);
            });
        }

        const apiStack = makeStack(apiTrack, () => { activeSheet = apiStack && apiStack.current(); });

        $('apiTie').addEventListener('click', e => {
            e.stopPropagation();
            openStack(apiStackEl);
            window.apiPresets().then(r => {
                presets = (r.presets || []).map(p => Object.assign({}, p));
                activeId = r.activeId || null;
                const idx = presets.findIndex(p => p.id === activeId);
                renderApi(idx < 0 ? 0 : idx);
            }).catch(err => { presets = []; renderApi(0); notify.fail('預設讀取失敗', err); });
        });

        apiTrack.addEventListener('click', e => {
            const sheet = e.target.closest('.api-sheet');
            const btn = e.target.closest('button');
            if (!sheet || !btn) return;
            activeSheet = sheet;
            const i = +sheet.dataset.i;
            const f = formOf(sheet);

            if (btn.classList.contains('js-add')) {
                /* 將「+」紙轉成有編號的新紙，保留輸入並補上下一張「+」紙。 */
                keepDrafts();
                presets.push({ id: '', note: f.note, endpoint: f.endpoint, key: f.key, model: f.model });
                renderApi(i);
                const giant = apiTrack.querySelector(`.api-sheet[data-i="${i}"] .api-giant`);
                if (giant) giant.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' });
            }
            else if (btn.classList.contains('js-toggle')) {
                e.preventDefault();
                const k = sheet.querySelector('.js-key');
                const show = k.type === 'password';
                k.type = show ? 'text' : 'password';
                btn.textContent = show ? 'HIDE' : 'SHOW';
            }
            else if (btn.classList.contains('js-model')) {
                if (!f.endpoint || !f.key) { notify.note('先填網址金鑰'); return; }
                setText(btn, '讀取中…');
                window.apiModels(f).then(list => {
                    setModel(sheet, f.model);
                    openTag({
                        giant: 'MODEL', kicker: 'SELECT', title: '模型',
                        items: list.map(m => ({ label: m, value: m, selected: m === f.model })),
                        onPick: m => setModel(sheet, m)
                    });
                }).catch(err => { setModel(sheet, f.model); notify.fail('模型讀取失敗', err); });
            }
            else if (btn.classList.contains('js-test')) {
                if (!f.endpoint || !f.key || !f.model) { notify.note('三項都要填'); return; }
                setText(sheet.querySelector('.js-status'), 'TESTING…');
                window.apiTest(f)
                    .then(() => notify.ok('連接成功'))
                    .catch(err => notify.fail('連接失敗', err))
                    .finally(refreshStatuses);
            }
            else if (btn.classList.contains('js-save')) {
                if (!f.note) { notify.note('寫個備註吧'); sheet.querySelector('.js-note').focus(); return; }
                if (!f.endpoint || !f.key || !f.model) { notify.note('三項都要填'); return; }
                window.saveApiPreset(f).then(saved => {
                    keepDrafts();
                    presets[i] = saved;
                    if (f.id) refreshStatuses(); else renderApi(i);
                    notify.ok('已保存');
                }).catch(err => notify.fail('保存失敗', err));
            }
            else if (btn.classList.contains('js-use')) {
                window.useApiPreset(f.id).then(() => {
                    activeId = f.id;
                    refreshStatuses();
                    notify.ok('已切換');
                }).catch(err => notify.fail('切換失敗', err));
            }
            else if (btn.classList.contains('js-del')) {
                /* 首次點擊顯示確認文字，2.5 秒內再次點擊才刪除。 */
                if (!btn.dataset.armed) {
                    btn.dataset.armed = '1';
                    setText(btn, '再點一次刪除');
                    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; setText(btn, 'DELETE'); } }, 2500);
                    return;
                }
                (f.id ? window.deleteApiPreset(f.id) : Promise.resolve()).then(() => {
                    /* 保留下沉淡出；先固定透明終點，結束後隱藏紙張再重排。 */
                    sheet.inert = true;
                    const fromTransform = sheet.style.transform;
                    sheet.style.opacity = 0;
                    const fall = sheet.animate([
                        { transform: fromTransform, opacity: 1 },
                        { transform: 'translate3d(-6px, 10px, 0) rotate(-1deg) scale(.985)', opacity: .85, offset: .35 },
                        { transform: 'translate3d(-18px, 34px, 0) rotate(-3deg) scale(.95)', opacity: 0 }
                    ], { duration: 520, easing: 'cubic-bezier(.4,.1,.5,1)', fill: 'both' });
                    fall.onfinish = () => {
                        sheet.style.visibility = 'hidden';
                        keepDrafts();
                        presets.splice(i, 1);
                        if (activeId === f.id) activeId = null;
                        renderApi(i);
                        fall.cancel();
                        notify.ok('已刪除');
                    };
                }).catch(err => notify.fail('刪除失敗', err));
            }
        });

        /* ===== 吊牌 =====
           openTag({ giant, giantY?, kicker, title, titleY?, titleAction?, items, onPick? })
           items: [{ label, value, selected?, static? }]
           titleAction 有值時，大字下面那行變成按鈕（例如 LOGOUT） */
        const hangTag = $('hangTag');
        const tagOverlay = $('tagOverlay');
        const tagList = $('tagList');

        function openTag(cfg) {
            const giant = $('tagGiant');
            giant.textContent = cfg.giant;
            giant.setAttribute('font-size', Math.min(28, Math.floor(118 / (cfg.giant.length * 0.62))));
            giant.setAttribute('y', cfg.giantY || 117);

            const title = $('tagTitle');
            title.textContent = cfg.title;
            title.setAttribute('y', cfg.titleY || 132);
            title.classList.toggle('is-action', !!cfg.titleAction);
            title.onclick = cfg.titleAction ? () => { closeTag(); cfg.titleAction(); } : null;

            $('tagKicker').textContent = cfg.kicker;
            fitRoofText();

            tagList.innerHTML = '';
            cfg.items.forEach(item => {
                const el = document.createElement('button');
                el.type = 'button';
                el.className = 'tag-option' + (item.selected ? ' is-selected' : '') + (item.static ? ' is-static' : '');
                el.textContent = item.label;
                if (!item.static) el.addEventListener('click', () => { closeTag(); cfg.onPick(item.value); });
                tagList.appendChild(el);
            });
            tagList.scrollTop = 0;
            updateListFade();

            /* 依目前紙張的位置計算繩長，讓吊牌停在紙張中央。 */
            const cardH = hangTag.querySelector('.tag-card').offsetHeight;
            const rect = (activeSheet || openStackEl).getBoundingClientRect();
            hangTag.style.setProperty('--tag-string', Math.max(20, rect.top + rect.height / 2 - cardH / 2 + 16) + 'px');
            hangTag.classList.add('is-visible');
            tagOverlay.classList.add('is-visible');
        }
        function closeTag() {
            hangTag.classList.remove('is-visible');
            tagOverlay.classList.remove('is-visible');
        }
        /* 列表尚未捲到底時，以底部漸隱提示還有選項。 */
        function updateListFade() {
            tagList.classList.toggle('is-overflow', tagList.scrollTop + tagList.clientHeight < tagList.scrollHeight - 1);
        }
        /* 字型載入或吊牌開啟時，依路徑長度調整屋頂文字大小。 */
        function fitRoofText() {
            const line = $('tagRoofLine');
            const room = $('roofLine').getTotalLength() - 14;
            let size = 6.2;
            line.setAttribute('font-size', size);
            while (line.getComputedTextLength() > room && size > 4) {
                size -= 0.2;
                line.setAttribute('font-size', size.toFixed(1));
            }
        }
        tagOverlay.addEventListener('click', closeTag);
        tagList.addEventListener('scroll', updateListFade);
        document.fonts.ready.then(fitRoofText);
        document.fonts.addEventListener('loadingdone', fitRoofText);

        /* ===== 封面圖：各訂閱獨立上傳、顯影與 IndexedDB 儲存 ===== */
        const COVER_DB = 'mian_connections', COVER_STORE = 'media';
        let coverDB = null;

        function showPlaceholder(c) { c.querySelector('.js-icon').style.display = 'flex'; c.querySelector('.js-loading').style.display = 'none'; }

        function renderCover(c, file, animate) {
            const art = c.querySelector('.js-art'), icon = c.querySelector('.js-icon');
            c.querySelector('.js-loading').style.display = 'none';
            const oldImg = art.querySelector('.uploaded-media');
            const dropOld = () => { if (!oldImg) return; URL.revokeObjectURL(oldImg.src); oldImg.remove(); };
            const img = document.createElement('img');
            img.className = 'uploaded-media';
            img.src = URL.createObjectURL(file);
            if (animate) {
                img.classList.add('developing');
                img.style.zIndex = '2';
                img.addEventListener('load', () => {
                    requestAnimationFrame(() => requestAnimationFrame(() => img.classList.remove('developing')));
                    setTimeout(() => { icon.style.display = 'none'; }, 300);
                    setTimeout(() => { dropOld(); img.style.zIndex = '1'; }, 900);
                }, { once: true });
            } else {
                dropOld();
                icon.style.display = 'none';
            }
            art.appendChild(img);
            art.classList.add('has-image');
        }

        /* 載入已儲存的封面；環境不支援 IndexedDB 時仍可顯示上傳圖片。 */
        try {
            const openReq = indexedDB.open(COVER_DB, 1);
            openReq.onupgradeneeded = () => openReq.result.createObjectStore(COVER_STORE);
            openReq.onsuccess = () => {
                coverDB = openReq.result;
                PROVIDERS.forEach(p => {
                    const c = coverOf(p.id);
                    c.querySelector('.js-icon').style.display = 'none';
                    c.querySelector('.js-loading').style.display = 'block';
                    const get = coverDB.transaction(COVER_STORE).objectStore(COVER_STORE).get(p.id + '_cover');
                    get.onsuccess = () => get.result ? renderCover(c, get.result, false) : showPlaceholder(c);
                    get.onerror = () => showPlaceholder(c);
                });
            };
        } catch {}

        subTrack.addEventListener('change', e => {
            const input = e.target.closest('.js-file');
            if (!input) return;
            const c = input.closest('.cover'), f = input.files[0];
            if (!f) return;
            renderCover(c, f, true);
            if (coverDB) {
                const tx = coverDB.transaction(COVER_STORE, 'readwrite');
                tx.onerror = () => notify.fail('封面存失敗', '瀏覽器沒能存下這張圖，可以再上傳一次。');
                tx.objectStore(COVER_STORE).put(f, c.dataset.p + '_cover');
            }
            input.value = '';
        });
    </script>
</body>
</html>
